name: Deploy radar and map (GitHub Pages)

# Публикует на GitHub Pages: https://<owner>.github.io/<repo>/
#   /            — радар шахедов (miniapp/radar.html), данные tracks.json
#   /snapshot.html — автономная карта угроз (map_live.html)
# tracks.json лежит в ветке radar-data: сервер сам пушит её раз в ~2 минуты
# (airradar-radar-publish.timer), входящих портов на сервере не нужно.
on:
  push:
    branches: [main, radar-data]
    paths: ["map_live.html", "miniapp/radar.html", ".github/workflows/deploy-map.yml", "tracks.json"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch radar data
        run: |
          mkdir -p site/radar
          cp miniapp/radar.html site/index.html
          cp map_live.html site/snapshot.html
          # /radar -> корень (ссылки вида <url>/radar из уведомлений)
          echo '<!doctype html><meta charset=utf-8><meta http-equiv=refresh content="0;url=../"><a href="../">radar</a>' > site/radar/index.html
          if git fetch --depth=1 origin radar-data 2>/dev/null; then
            git show FETCH_HEAD:tracks.json > site/tracks.json
          else
            echo '{"now":0,"tracks":[]}' > site/tracks.json
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
