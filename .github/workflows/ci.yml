name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider
      - name: Benchmark (informational, якщо є набір даних)
        run: test -f tests_data/ar_sample.jsonl.gz && python benchmark.py --json || echo "dataset not published"
