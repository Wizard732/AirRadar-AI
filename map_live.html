<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>AirRadar AI — Карта загроз</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0b0e14; font-family: -apple-system, 'Segoe UI', sans-serif; color: #fff; overflow: hidden; }
  #map { width: 100%; height: 100vh; z-index: 1; background: #0b0e14; }

  /* Еле заметная тактическая сетка поверх тайлов (МГРС-стиль) */
  #tactical-grid {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background-image:
      linear-gradient(rgba(90,200,250,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,200,250,0.05) 1px, transparent 1px);
    background-size: 64px 64px;
  }

  /* Красная вспышка рамки при угрозе в личном радиусе */
  #alert-flash {
    position: absolute; inset: 0; z-index: 3000; pointer-events: none;
    box-shadow: inset 0 0 0 3px rgba(255,59,48,0);
    opacity: 0;
  }
  #alert-flash.on { animation: alertflash 1.1s ease-out 2; }
  @keyframes alertflash {
    0%   { opacity: 0; box-shadow: inset 0 0 0 3px rgba(255,59,48,0); }
    30%  { opacity: 1; box-shadow: inset 0 0 70px 10px rgba(255,59,48,0.5); }
    100% { opacity: 0; box-shadow: inset 0 0 0 3px rgba(255,59,48,0); }
  }

  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1100;
    background: rgba(11,14,20,0.94); padding: 10px 16px; backdrop-filter: blur(10px);
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(90,200,250,0.15);
  }
  #header h1 { font-size: 15px; font-weight: 700; letter-spacing: .4px; }
  #header .count { font-size: 12px; color: #ff9f0a; text-align: right; }

  /* Лента событий (тикер) */
  #ticker {
    position: absolute; top: 44px; left: 0; right: 0; z-index: 1090;
    background: rgba(11,14,20,0.9); border-bottom: 1px solid rgba(90,200,250,0.12);
    font-size: 12px; color: #9fd0e8; white-space: nowrap; overflow: hidden;
    max-height: 30px; cursor: pointer; transition: max-height .25s ease;
    backdrop-filter: blur(8px);
  }
  #ticker .scroll { display: inline-block; padding: 7px 0 7px 100vw; animation: tickerscroll 45s linear infinite; }
  @keyframes tickerscroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  #ticker.expanded { max-height: 46vh; overflow-y: auto; white-space: normal; }
  #ticker.expanded .scroll { animation: none; padding: 4px 12px 8px; display: block; white-space: normal; }
  .tick-line { padding: 6px 0; border-bottom: 1px solid rgba(90,200,250,0.08); }
  .tick-line b { color: #cfe9f5; }

  #legend {
    position: absolute; bottom: calc(100% + 8px); left: 8px; right: 8px; z-index: 1150;
    background: rgba(11,14,20,0.96); border: 1px solid rgba(90,200,250,0.25);
    border-radius: 12px; padding: 9px 12px; font-size: 11.5px;
    display: flex; gap: 10px 14px; justify-content: center; flex-wrap: wrap;
    box-shadow: 0 -6px 24px rgba(0,0,0,0.5);
  }
  #legend[hidden] { display: none; }
  .leg-item { display: flex; align-items: center; gap: 5px; color: #c8c8d0; }
  .leg-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%{opacity:1} 50%{opacity:0.35} 100%{opacity:1} }

  /* Кнопка «Слої»: сворачивает колонку фильтров в один контрол (мобильный фикс:
     10 чипов вертикально вылетали за край экрана). */
  #layersBtn {
    position: absolute; top: 82px; right: 8px; z-index: 1160;
    background: rgba(11,14,20,0.92); border: 1px solid rgba(90,200,250,0.35); color: #fff;
    padding: 8px 13px; border-radius: 18px; font-size: 12.5px; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  #layersBtn:active { transform: scale(0.96); border-color: #5ac8fa; }
  #layersPanel {
    position: absolute; top: 124px; right: 8px; z-index: 1155;
    background: rgba(11,14,20,0.96); border: 1px solid rgba(90,200,250,0.3);
    border-radius: 14px; padding: 10px; backdrop-filter: blur(12px);
    display: none; grid-template-columns: 1fr 1fr; gap: 6px;
    max-width: min(230px, 62vw); max-height: calc(100vh - 280px); overflow-y: auto;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  }
  #layersPanel.open { display: grid; }

  .chip {
    background: rgba(11,14,20,0.92); border: 1px solid rgba(90,200,250,0.25); color: #fff;
    padding: 6px 9px; border-radius: 13px; font-size: 11.5px; cursor: pointer;
    user-select: none; backdrop-filter: blur(8px); text-align: left; white-space: nowrap;
    transition: opacity .2s, border-color .2s, transform .1s;
  }
  .chip:active { transform: scale(0.96); border-color: #5ac8fa; }
  .chip.off { opacity: 0.35; text-decoration: line-through; }

  /* Нижняя панель: таймлайн + действия. Кнопки «Укриття/Розташування/
     Поділитися» больше не плавают поверх карты — живут в одной панели. */
  #bottomBar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 1100;
    background: rgba(11,14,20,0.94); border-top: 1px solid rgba(90,200,250,0.15);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); backdrop-filter: blur(10px);
    display: flex; flex-direction: column; gap: 7px;
  }
  #timeline {
    position: static; display: flex; align-items: center; gap: 8px;
    background: rgba(90,200,250,0.06); padding: 5px 10px; border-radius: 12px;
    font-size: 11.5px; border: 1px solid rgba(90,200,250,0.15);
  }
  #timeline input[type=range] { flex: 1; accent-color: #ff9500; min-width: 60px; }
  #playBtn {
    background: rgba(90,200,250,0.12); border: 1px solid rgba(90,200,250,0.3); color: #5ac8fa;
    font-size: 14px; cursor: pointer; padding: 3px 10px; border-radius: 10px; line-height: 1.2;
  }
  #actions { display: flex; gap: 7px; }
  #actions button {
    flex: 1; background: rgba(90,200,250,0.10); border: 1px solid rgba(90,200,250,0.3);
    color: #fff; padding: 9px 4px; border-radius: 12px; font-size: 12.5px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #actions button:active { transform: scale(0.96); border-color: #5ac8fa; }
  #legendBtn {
    background: rgba(90,200,250,0.12); border: 1px solid rgba(90,200,250,0.3); color: #5ac8fa;
    font-size: 13px; cursor: pointer; padding: 2px 9px; border-radius: 10px; line-height: 1.4;
    margin-left: 8px; flex: none;
  }

  /* Bottom Sheet — карточка объекта */
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2000;
    background: rgba(15,19,28,0.97); border-top: 1px solid rgba(90,200,250,0.3);
    border-radius: 16px 16px 0 0; padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .25s ease;
    backdrop-filter: blur(14px); box-shadow: 0 -8px 32px rgba(0,0,0,0.55);
  }
  #sheet.open { transform: translateY(0); }
  #sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); margin: 0 auto 10px; }
  #sheet .close {
    position: absolute; top: 10px; right: 14px; background: none; border: none;
    color: #8e8e93; font-size: 17px; cursor: pointer;
  }
  #sheet h3 { font-size: 15px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; padding-right: 26px; }
  #sheet .lvl { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 700; letter-spacing: .5px; }
  #sheet .meta { font-size: 12px; color: #9fd0e8; margin-bottom: 8px; }
  #sheet .body {
    font-size: 13px; color: #e5e5ea; line-height: 1.45; white-space: pre-wrap;
    max-height: 32vh; overflow-y: auto;
  }
  #sheet .body .ev { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  #sheet .body .ev:last-child { border-bottom: none; }
  #sheet .body .ev .t { color: #9fd0e8; font-size: 11px; }
  #sheet .note { font-size: 10.5px; color: #667; margin-top: 8px; }
  #sheet .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #sheet .actions a {
    flex: 1; min-width: 130px; text-align: center; text-decoration: none;
    font-size: 13px; padding: 9px 12px; border-radius: 10px;
    background: rgba(90,200,250,0.12); border: 1px solid rgba(90,200,250,0.3); color: #fff;
  }

  #toast {
    position: absolute; bottom: calc(132px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%);
    z-index: 2500; background: rgba(15,19,28,0.95); border: 1px solid rgba(90,200,250,0.3);
    padding: 8px 16px; border-radius: 20px; font-size: 12.5px; color: #cfe9f5;
    opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  .leaflet-control-attribution { background: rgba(11,14,20,0.7) !important; color: #666 !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: #888 !important; }
  .leaflet-bar a { background: #161b26 !important; color: #cfe9f5 !important; border-color: rgba(90,200,250,0.2) !important; }
  .leaflet-tooltip { background: #161b26 !important; border: 1px solid rgba(90,200,250,0.3) !important; color: #cfe9f5 !important; }
  /* Зум-контрол под хедером (44px) и тикером (30px): иначе он перекрыт
     хедером и некликабелен. */
  .leaflet-top { top: 84px; }
</style>
</head>
<body>

<div id="header">
  <h1>🛡 AirRadar AI</h1>
  <div class="count" id="counter">— загроз</div>
</div>

<div id="ticker" title="Останні події"><div class="scroll" id="tickerInner">⏳ Завантаження подій…</div></div>

<div id="map"></div>
<div id="tactical-grid"></div>
<div id="alert-flash"></div>

<button id="layersBtn" type="button">🗂 Слої</button>
<div id="layersPanel" role="group" aria-label="Шарі карти">
  <div class="chip" data-layer="rockets">🔴 Ракети</div>
  <div class="chip" data-layer="uav">🟡 БПЛА</div>
  <div class="chip" data-layer="alerts">🟢 Тривоги</div>
  <div class="chip" data-layer="impacts">💥 Наслідки</div>
  <div class="chip" data-layer="zones">🌀 Зони</div>
  <div class="chip" data-layer="vectors">➤ Вектори</div>
  <div class="chip" data-layer="reports">👤 Повідомл.</div>
  <div class="chip" data-layer="green">✅ Відбої</div>
  <div class="chip off" data-layer="shields">🛡 Укриття</div>
  <div class="chip" data-layer="sound">🔊</div>
</div>

<div id="bottomBar">
  <div id="legend" hidden>
    <div class="leg-item">🛸 Шахед/БПЛА</div>
    <div class="leg-item pulse">🚀 Ракета/балістика</div>
    <div class="leg-item">✈️ КАБ/авіація</div>
    <div class="leg-item">💥 Приліт</div>
    <div class="leg-item">👁 Розвідка</div>
    <div class="leg-item">🛡 ППО</div>
    <div class="leg-item pulse">👤 Повідомлення</div>
    <div class="leg-item">➤ напрямок · ⏳/🔁 прогноз</div>
  </div>
  <div id="timeline">
    <button id="playBtn" type="button" title="Плейбэк за 2 години">▶</button>
    <input id="tlRange" type="range" min="0" max="120" step="5" value="0">
    <span id="tlLabel">зараз</span>
    <button id="legendBtn" type="button" title="Легенда позначок" aria-label="Легенда">ⓘ</button>
  </div>
  <div id="actions">
    <button id="geoBtn" type="button">📍 Я тут</button>
    <button id="shelterBtn" type="button">🛡 Укриття</button>
    <button id="shareBtn" type="button">📤 Поділитися</button>
  </div>
</div>

<!-- Bottom Sheet -->
<div id="sheet">
  <div class="grab" id="sheetGrab"></div>
  <button class="close" id="sheetClose" type="button">✕</button>
  <h3 id="sheetTitle">—</h3>
  <div class="meta" id="sheetMeta"></div>
  <div class="body" id="sheetBody"></div>
  <div class="note" id="sheetNote"></div>
  <div class="actions" id="sheetActions"></div>
</div>

<div id="toast"></div>

<script>
'use strict';

// === Берега Киева: точки пинов + те же ключи, что в regions.detect_kyiv_zone
// (бот и карта размечают берег одинаково). ОБЪЯВЛЕНО ДО REGION_COORDS,
// который ссылается на координаты берегов.
const KYIV_BANK = {
  kyiv_left: {
    coords: [50.4668, 30.6380], // Дарниця / Лівобережна
    keys: ['лівий берег', 'левый берег', 'левый', 'лівобереж', 'лівобережж', 'дарниц',
      'позняк', 'осокорк', 'харківськ', 'деснянськ', 'троєщин', 'русанів', 'бортнич', 'дніпровськ',
      // Лівобережні райцентри Київщини
      'бровар', 'переяслав', 'яготин', 'баришівк', 'згурівк', 'кагарлик', 'славутич'],
  },
  kyiv_right: {
    coords: [50.4440, 30.5150], // правобережный центр
    keys: ['правий берег', 'правый берег', 'правый', 'правобереж', 'правобережж',
      'оболон', 'печерськ', 'голосіїв', 'теремки', 'святошин', "солом'янск", 'соломянск',
      'шулявк', 'подол', 'борщагівк', 'жуляни', 'видубичі',
      // Правобережні райцентри Київщини: «курсом на Ржищів» — не «весь Киев»
      'ржищів', 'миронівк', 'васильк', 'біла церкв', 'белая церков',
      'фастів', 'фастов', 'обухів', 'вишгород', 'буч', 'ірпін', 'ирпен',
      'гостомел', 'боярк', 'вишнев', 'сквир', 'тетіїв', 'димер'],
  },
};

// === Координаты центров регионов Украины ===
const REGION_COORDS = {
  kyivska: [50.45, 30.52], sumska: [50.91, 34.80], kharkivska: [49.99, 36.23],
  chernigivska: [51.49, 31.29], odeska: [46.48, 30.73], dnipropetrovska: [48.46, 35.05],
  zhytomyrska: [50.25, 28.66], vinnytska: [49.23, 28.48], lvivska: [49.84, 24.03],
  poltavska: [49.59, 34.55], cherkaska: [49.44, 32.06], rivnenska: [50.62, 26.25],
  volynska: [50.75, 25.33], khmelnytska: [49.42, 27.00], ternopilska: [49.55, 25.59],
  ivano_frankivska: [48.92, 24.71], zakarpatska: [48.62, 22.29], mykolaivska: [46.97, 32.00],
  khersonska: [46.64, 32.62], zaporizka: [47.84, 35.14], kirovohradska: [48.51, 32.26],
  donetska: [48.00, 37.80], luhanska: [48.57, 39.31], crimea: [44.95, 34.10],
  chernivetska: [48.29, 25.94],
  kyiv_left: KYIV_BANK.kyiv_left.coords, kyiv_right: KYIV_BANK.kyiv_right.coords,
};

const REGION_NAMES = {
  kyivska: 'Київщина', sumska: 'Сумщина', kharkivska: 'Харківщина',
  chernigivska: 'Чернігівщина', odeska: 'Одещина', dnipropetrovska: 'Дніпропетровщина',
  zhytomyrska: 'Житомирщина', vinnytska: 'Вінничина', lvivska: 'Львівщина',
  poltavska: 'Полтавщина', cherkaska: 'Черкащина', rivnenska: 'Рівненщина',
  volynska: 'Волинь', khmelnytska: 'Хмельниччина', ternopilska: 'Тернопільщина',
  ivano_frankivska: 'Прикарпаття', zakarpatska: 'Закарпаття', mykolaivska: 'Миколаївщина',
  khersonska: 'Херсонщина', zaporizka: 'Запоріжжя', kirovohradska: 'Кіровоградщина',
  donetska: 'Донеччина', luhanska: 'Луганщина', crimea: 'Крим',
  chernivetska: 'Буковина',
  kyiv_left: 'Київ — лівий берег', kyiv_right: 'Київ — правий берег',
  // Служебные slug-и инцидентов — человекочитаемо, не сырым «multi:».
  multi: 'Кілька областей', unknown: 'Регіон уточнюється',
};

// === Города/посёлки: точечный пин по упоминанию в тексте ===
// Зеркало city_coords.py (карта работает автономно). Ключи — основы слов:
// «над Гостомелем», «у Бучі», «на Ірпінь» матчатся подстрокой.
const CITY_COORDS = {
  hostomel: { name: 'Гостомель', region: 'kyivska', c: [50.530, 30.262], keys: ['гостомел', 'гостоміл', 'hostomel'] },
  irpin: { name: 'Ірпінь', region: 'kyivska', c: [50.523, 30.241], keys: ['ірпін', 'ірпен', 'ирпен', 'ирпин', 'irpin'] },
  bucha: { name: 'Буча', region: 'kyivska', c: [50.547, 30.223], keys: ['буч', 'bucha'] },
  vyshhorod: { name: 'Вишгород', region: 'kyivska', c: [50.588, 30.489], keys: ['вишгород', 'вышгород'] },
  brovary: { name: 'Бровари', region: 'kyivska', c: [50.511, 30.790], keys: ['бровар'] },
  boryspil: { name: 'Бориспіль', region: 'kyivska', c: [50.353, 30.955], keys: ['бориспіл', 'бориспол'] },
  vasylkiv: { name: 'Васильків', region: 'kyivska', c: [50.180, 30.318], keys: ['васильк'] },
  fastiv: { name: 'Фастів', region: 'kyivska', c: [50.077, 29.917], keys: ['фастів', 'фастов'] },
  bila_tserkva: { name: 'Біла Церква', region: 'kyivska', c: [49.798, 30.115], keys: ['біла церкв', 'белая церков', 'білоцерків', 'белоцерков'] },
  vyshneve: { name: 'Вишневе', region: 'kyivska', c: [50.389, 30.363], keys: ['вишнев'] },
  slavutych: { name: 'Славутич', region: 'kyivska', c: [51.518, 30.755], keys: ['славутич'] },
  obolon: { name: 'Київ — Оболонь', region: 'kyivska', c: [50.508, 30.495], keys: ['оболон'] },
  pechersk: { name: 'Київ — Печерськ', region: 'kyivska', c: [50.433, 30.537], keys: ['печерськ', 'печерск'] },
  podil: { name: 'Київ — Поділ', region: 'kyivska', c: [50.463, 30.516], keys: ['подол', 'поділ'] },
  darnytsia: { name: 'Київ — Дарниця', region: 'kyivska', c: [50.466, 30.638], keys: ['дарниц'] },
  pozniaiaky: { name: 'Київ — Позняки', region: 'kyivska', c: [50.415, 30.635], keys: ['позняк'] },
  troieshchyna: { name: 'Київ — Троєщина', region: 'kyivska', c: [50.525, 30.584], keys: ['троєщин', 'троещин'] },
  sviatoshyn: { name: 'Київ — Святошин', region: 'kyivska', c: [50.455, 30.375], keys: ['святошин'] },
  solomianka: { name: "Київ — Солом'янка", region: 'kyivska', c: [50.429, 30.478], keys: ["солом'янск", 'соломянск'] },
  holosiiv: { name: 'Київ — Голосіїв', region: 'kyivska', c: [50.403, 30.513], keys: ['голосіїв', 'голосеев'] },
  osokorky: { name: 'Київ — Осокорки', region: 'kyivska', c: [50.396, 30.642], keys: ['осокорк'] },
  borshchahivka: { name: 'Київ — Борщагівка', region: 'kyivska', c: [50.432, 30.396], keys: ['борщагівк', 'борщаговк'] },
  zhuliany: { name: 'Київ — Жуляни', region: 'kyivska', c: [50.406, 30.450], keys: ['жуляни', 'жулення'] },
  teremky: { name: 'Київ — Теремки', region: 'kyivska', c: [50.376, 30.475], keys: ['теремки'] },

// Все города/районы, упомянутые в тексте (до 3, самый конкретный первым).
// Конкретность = длина совпавшего ключа: «Харків, Салтівка» даёт Салтівку
// (ключ 'салтівк' длиннее 'харків'), «Оболонь і Поділ» — два пина сразу.
function citySlugsOf(text, max = 3) {
  const lower = (text || '').toLowerCase();
  const best = new Map(); // slug -> длина самого длинного совпавшего ключа
  for (const [slug, city] of Object.entries(CITY_COORDS)) {
    let len = 0;
    for (const k of city.keys) {
      if (lower.includes(k) && k.length > len) len = k.length;
    }
    if (len) best.set(slug, len);
  }
  return [...best.entries()]
    .sort((a, b) => b[1] - a[1]) // стабильная сортировка: при равенстве — порядок таблицы
    .slice(0, max)
    .map(e => e[0]);
}

// Київские события вешаем на конкретный берег, если источник его назвал.
function pinSlugOf(t) {
  if (t.region !== 'kyivska') return t.region;
  const lower = (t.text || '').toLowerCase();
  const left = KYIV_BANK.kyiv_left.keys.some(k => lower.includes(k));
  const right = KYIV_BANK.kyiv_right.keys.some(k => lower.includes(k));
  if (left && !right) return 'kyiv_left';
  if (right && !left) return 'kyiv_right';
  return 'kyivska';
}

// Пины события: упомянутые в тексте города/районы (до 3) → берег Киева → центр области.
function pinsOf(t) {
  const slugs = citySlugsOf(t.text);
  if (slugs.length) {
    return slugs
      .filter(s => CITY_COORDS[s])
      .map(s => ({
        key: 'city:' + s, coord: CITY_COORDS[s].c,
        label: CITY_COORDS[s].name, region: CITY_COORDS[s].region, isCity: true,
      }));
  }
  const slug = pinSlugOf(t);
  const pin = {
    key: slug,
    coord: REGION_COORDS[slug] || null,
    label: REGION_NAMES[slug] || slug,
    region: t.region,
    isCity: false,
  };
  return pin.coord ? [pin] : [];
}

// Город-цель: упомянут в тексте и принадлежит региону-цели (уточняет луч
// до конкретного города, а не центра области).
function cityTargetOf(text, regionSlug) {
  const lower = (text || '').toLowerCase();
  for (const city of Object.values(CITY_COORDS)) {
    if (city.region === regionSlug && city.keys.some(k => lower.includes(k))) return city;
  }
  return null;
}

// Маршрут вектора: см. комментарий внутри routeOf.
function routeOf(t, pin) {
  // Приоритет — измеренный трек (track_speed из БД): реальные засечки
  // «город → город» с фактической скоростью и курсом. Фолбэк — данные
  // фьюжена из БД («з X на Y» сохранено в incidents.origin/destination),
  // затем keyword-угадыватель. Если цель неясна, но origin явный — рисуем
  // входящий луч origin → пин.
  if (t.track && t.track.from && t.track.to) {
    return {
      from: t.track.from, to: t.track.to,
      fromName: t.track.from_name || '—', toName: t.track.to_name || '—',
      isTrack: true, track: t.track,
    };
  }
  const sourceRegion = pin.isCity ? pin.region : pinSlugOf(t);
  const originKnown = t.origin && t.origin !== sourceRegion && t.origin !== t.region
    && REGION_COORDS[t.origin];
  let targetSlug = '';
  if (t.destination && t.destination !== 'multi' && t.destination !== 'unknown'
    && REGION_COORDS[t.destination] && t.destination !== sourceRegion) {
    targetSlug = t.destination;
  }
  if (!targetSlug) targetSlug = guessTargetRegion(t.text, sourceRegion) || '';

  if (!targetSlug) {
    if (originKnown) {
      return { from: REGION_COORDS[t.origin], to: pin.coord,
        fromName: REGION_NAMES[t.origin] || t.origin, toName: pin.label };
    }
    return null;
  }
  const targetCity = cityTargetOf(t.text, targetSlug);
  const to = targetCity ? targetCity.c : REGION_COORDS[targetSlug];
  const toName = targetCity ? targetCity.name : (REGION_NAMES[targetSlug] || targetSlug);
  let from = pin.coord, fromName = pin.label;
  if (originKnown) {
    from = REGION_COORDS[t.origin];
    fromName = REGION_NAMES[t.origin] || t.origin;
  }
  if (from[0] === to[0] && from[1] === to[1]) return null;
  return { from, to, fromName, toName };
}

// === Микро-звуки + хаптика (тактический фидбек) ===
let soundOn = localStorage.getItem('ar_sound') !== '0';
let audioCtx = null;
function beep(freq, dur, vol) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch (e) { /* звук не критичен */ }
}
function haptic(style) {
  try {
    const hf = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback;
    if (hf) { hf.impactOccurred(style || 'light'); }
    else if (navigator.vibrate) { navigator.vibrate(10); }
  } catch (e) { /* не критично */ }
}
function tapFeedback() { haptic('light'); beep(880, 0.045, 0.025); }
function alertFeedback() {
  haptic('heavy'); haptic('rigid');
  if (navigator.vibrate) { try { navigator.vibrate([60, 60, 60]); } catch (e) {} }
  beep(240, 0.28, 0.05);
}

function fmtClock(ageMin) {
  const d = new Date(Date.now() - ageMin * 60000);
  const hh = String(d.getHours()).padStart(2, '0');

}

function distanceKm(a, b) {
  const R = 6371;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 +
    Math.cos(a[0] * Math.PI / 180) * Math.cos(b[0] * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

  return Math.max(1, Math.round(km / v * 60));
}

function guessTargetRegion(text, sourceSlug) {
  const lower = (text || '').toLowerCase();
  for (const [slug, hints] of Object.entries(CITY_HINTS)) {
    if (slug !== sourceSlug && hints.some(h => lower.includes(h))) return slug;
  }
  return TRANSIT_TARGETS[sourceSlug] || null;
}

// === Данные: кэш + рендер без «телепортов» ===
let threatsCache = [];
let reportsCache = [];
let forecastCache = {};   // регион → {standdown_min, next_wave_min} (статистика волн)
let pinGroupsCache = [];  // [{pin, items}] последнего рендера — для «что рядом»
let lastFlashKeys = '';

async function fetchData() {
  try {
    threatsCache = EMBEDDED_THREATS || [];
    reportsCache = EMBEDDED_REPORTS || [];
    forecastCache = EMBEDDED_FORECAST || {};
    renderAll();
    renderTicker();
  } catch (e) {
    const counter = document.getElementById('counter');
    counter.textContent = '⚠ Помилка з\'єднання';
    counter.style.color = '#ff3b30';
  }
}

function threatsAtScrub() {
  return threatsCache.filter(t => {
    if (minutesAgo === 0) return t.age_min <= 30; // «зараз» — живое окно 30 мин
    return Math.abs(t.age_min - minutesAgo) <= 5; // плейбэк: окно вокруг позиции
  });
}

// Отбой закрывает инцидент: угрозы региона, СТАРШЕЕ отбоя, скрываем сразу,
// не ждём 30 минут. Свежее угрозы после отбоя продолжают показываться.
function standDownAgeByRegion(cache) {
  const m = new Map();
  cache.forEach(t => {
    if (t.type !== 'stand_down') return;
    const prev = m.get(t.region);
    if (prev === undefined || t.age_min < prev) m.set(t.region, t.age_min);
  });
  return m;
}

// === Анимация активных векторов: точка летит вдоль луча со шлейфом ===
let animDots = [];
let animRaf = null;
let animLastTs = null;
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function resetAnim() { animDots = []; }

// Мини-силуэт летящего аппарата для ведущей точки вектора: та же форма,
// что у пина (WEAPON_SVG), нос повёрнут по курсу (0° = север).
function flyingIconHtml(type, color, angle) {
  const shape = TYPE_ICON_SHAPE[type] || 'drone';
  const svg = (WEAPON_SVG[shape] || WEAPON_SVG.drone)
    .replaceAll('{c}', color)
    .replaceAll('{s}', 'rgba(0,0,0,0.55)');
  return `<div style="transform:rotate(${angle}deg);filter:drop-shadow(0 0 4px ${color});display:flex">` +
    `<svg width="20" height="20" viewBox="0 0 24 24" style="display:block">${svg}</svg></div>`;
}

function spawnAnimDots(from, to, color, type, kmh) {
  if (REDUCED_MOTION) return;
  const angle = Math.round(Math.atan2(to[1] - from[1], to[0] - from[0]) * 180 / Math.PI);
  // Ведущий элемент вектора — сам летящий аппарат: мини-силуэт типа,
  // развёрнутый носом по курсу. Позади — тающий шлейф точек.
  const lead = L.marker(from, {
    icon: L.divIcon({
      className: '', html: flyingIconHtml(type, color, angle),
      iconSize: [20, 20], iconAnchor: [10, 10],
    }),
    interactive: false,
  }).addTo(vectorLayer);
  const dots = [lead];
  for (let i = 1; i < 4; i++) {
    dots.push(L.circleMarker(from, {
      radius: Math.max(1.5, 3 - i * 0.5),
      color: color, weight: 0,
      fillColor: color, fillOpacity: 0.38 - i * 0.09,
      interactive: false,
    }).addTo(vectorLayer));
  }
  animDots.push({ dots, from, to, t: Math.random(), step: (kmh || ETA_KMH[type] || 170) >= 800 ? 1 / 1400 : 1 / 2600 });
  ensureAnim();
}

function animLoop(ts) {
  if (!animDots.length) { animRaf = null; animLastTs = null; return; }
  if (animLastTs == null) animLastTs = ts;
  const dt = Math.min(60, ts - animLastTs);
  animLastTs = ts;
  for (const d of animDots) {
    d.t += dt * d.step;
    if (d.t > 1) d.t -= 1;
    for (let i = 0; i < d.dots.length; i++) {
      let tt = d.t - i * 0.045;
      if (tt < 0) tt += 1;
      d.dots[i].setLatLng([d.from[0] + (d.to[0] - d.from[0]) * tt, d.from[1] + (d.to[1] - d.from[1]) * tt]);
    }
  }
  animRaf = requestAnimationFrame(animLoop);
}

function ensureAnim() {
  if (animRaf == null && animDots.length) { animLastTs = null; animRaf = requestAnimationFrame(animLoop); }
}

function renderAll() {
  const scrubbed = threatsAtScrub();
  const sdAge = standDownAgeByRegion(minutesAgo === 0 ? threatsCache : scrubbed);
  const closedByRegion = slug => {
    const age = sdAge.get(slug);
    return age !== undefined && age <= 40;
  };
  // Угроза старше отбоя = инцидент закрыт: не показываем её ни в пинах, ни в зонах.
  const active = scrubbed.filter(t =>
    t.type !== 'stand_down' &&
    !(minutesAgo === 0 && closedByRegion(t.region) && t.age_min > sdAge.get(t.region))
  );
  const visible = active.filter(t => enabled[layerOf(t)]);
  const groups = new Map();
  visible.forEach(t => {
    // «БпЛА на Оболоні та Подолі» → два пина; «Харків, Салтівка» → Салтівка
    // первым (самый конкретный) + Харків вторым.
    for (const pin of pinsOf(t)) {
      if (!groups.has(pin.key)) groups.set(pin.key, { pin, items: [] });
      groups.get(pin.key).items.push(t);
    }
  });
  // Кэш групп для тостов «что рядом со мной»: рендер — единственный
  // источник правды, requestGeo/toasts читают кэш, а не DOM.
  pinGroupsCache = Array.from(groups.values());

  // Слой 4: зелёные зоны отбоев (последние 40 минут)
  greenLayer.clearLayers();
  if (minutesAgo === 0) {
    const clearRegions = new Set(
      threatsCache.filter(t => t.type === 'stand_down' && t.age_min <= 40).map(t => t.region)
    );
    clearRegions.forEach(slug => {
      const c = REGION_COORDS[slug];
      if (!c || groups.has(slug)) return; // активная угроза важнее отбоя
      L.circle(c, {
        radius: 42000, color: '#34c759', weight: 1, opacity: 0.5,
        fillColor: '#34c759', fillOpacity: 0.10,
      }).addTo(greenLayer)
        .bindTooltip(`🟢 ${REGION_NAMES[slug] || slug}: відбій`, { direction: 'top' });
      L.marker(c, {
        icon: L.divIcon({ className: '', html: '✅', iconSize: [18, 18], iconAnchor: [9, 9] }),
        interactive: false,
      }).addTo(greenLayer);
    });
  }

  // Слои 1-2: зоны и векторы
  zoneLayer.clearLayers();
  vectorLayer.clearLayers();
  markersLayer.clearLayers();
  resetAnim();

  let criticalCount = 0;
  // Трек из БД (track_speed) уникален по паре «город → город»: одна и та же
  // цель часто даёт несколько пинов/событий, рисуем её луч один раз.
  const trackSeen = new Set();
  const trackSigOf = t => (t.track && t.track.from && t.track.to)
    ? `${t.track.from[0].toFixed(2)},${t.track.from[1].toFixed(2)}>${t.track.to[0].toFixed(2)},${t.track.to[1].toFixed(2)}`
    : '';
  groups.forEach(({ pin, items }) => {
    const slug = pin.region;
    const coords = pin.coord;
    let top = items[0];
    items.forEach(t => {
      if (SEVERITY_ORDER[TYPE_LEVEL[t.type]] > SEVERITY_ORDER[TYPE_LEVEL[top.type]]) top = t;
    });
    if (TYPE_LEVEL[top.type] === 'critical') criticalCount++;

    const color = TYPE_COLORS[top.type] || '#8e8e93';
    const fresh = items.some(t => t.age_min < 10);
    const confirmed = items.some(t => Number(t.sources || 1) >= 2);

    // Слой 1: мягкая пульсирующая зона — только там, где она честна.
    // Район/город — компактные 8 км. Берег Киева — тоже компактный,
    // иначе снова «угроза на весь Киев». Голая «kyivska» (район в тексте
    // не назван) зону не получает вовсе: силуэт и вектор показывают
    // конкретный полёт, а не «весь Киев под угрозой».
    const zoneR = (pin.isCity || pin.key === 'kyiv_left' || pin.key === 'kyiv_right')
      ? 8000
      : (pin.key === 'kyivska' ? 0 : (confirmed ? 34000 : 24000));
    if (fresh && zoneR > 0) {
      L.circle(coords, {
        radius: zoneR,
        color: color, weight: 1, opacity: 0.35,
        fillColor: color, fillOpacity: 0.07,
        className: 'pulse',
      }).addTo(zoneLayer).on('click', () => { tapFeedback(); openThreatSheet(pin, items); });
    }

    // Вектор считаем один раз: он нужен и для разворота силуэта, и для луча.
    let route = (fresh && ['uav', 'rockets'].includes(layerOf(top)))
      ? routeOf(top, pin) : null;
    // Дедуп трека: один измеренный луч на пару городов, остальные пины без луча.
    if (route && route.isTrack && trackSigOf(top)) {
      if (trackSeen.has(trackSigOf(top))) route = null;
      else trackSeen.add(trackSigOf(top));
    }
    // Направление полёта: разворачиваем силуэт носом по курсу (0° = север).
    // Для измеренного трека — курс из БД (course_deg), иначе — по геометрии луча.
    const angle = route
      ? (route.isTrack && Number.isFinite(route.track.course_deg)
          ? Math.round(route.track.course_deg)
          : Math.round(Math.atan2(route.to[1] - route.from[1], route.to[0] - route.from[0]) * 180 / Math.PI))
      : (top.track && Number.isFinite(top.track.course_deg) ? Math.round(top.track.course_deg) : 0);

    // Пин: силуэт типа оружия (шахед-дельтакрыло / ракета / самолёт / вспышка)
    // с цветным свечением. Белая обводка = подтверждено несколькими источниками.
    const approach = items.some(t => approachOf(t.text));
    const marker = L.marker(coords, {
      icon: L.divIcon({
        className: '',
        html: weaponIconHtml(top, color, fresh, confirmed, angle) +
          (approach ? `<span style="position:absolute;left:26px;top:-8px;background:#ff3b30;` +
            `color:#fff;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:8px;` +
            `border:1px solid rgba(255,255,255,0.75);text-shadow:0 0 3px #000;white-space:nowrap">` +
            `🎯 на підході</span>` : ''),
        iconSize: [38, 38], iconAnchor: [19, 19],
      }),
    }).addTo(markersLayer).bindTooltip(regionTooltip(pin, items) + (approach ? ' · 🎯 курс на ціль' : ''), { direction: 'top' });
    marker.on('click', () => { tapFeedback(); openThreatSheet(pin, items); });

    if (items.length > 1) {
      L.marker(coords, {
        icon: L.divIcon({
          className: '',
          html: `<span style="position:absolute;left:14px;top:-10px;background:#ff3b30;` +
            `color:#fff;font-size:10px;font-weight:700;padding:1px 5px;` +
            `border-radius:9px;border:1px solid rgba(255,255,255,0.7);` +
            `text-shadow:0 0 3px #000">${items.length}</span>`,
          iconSize: [20, 20], iconAnchor: [0, 0],
        }),
        interactive: false,
      }).addTo(markersLayer);
    }

    // Слой 2: векторный луч для свежих БПЛА/ракет. Маршрут — из данных
    // фьюжена (origin/destination поста «з X на Y»), фолбэк — эвристика.
    // Работает и для киевских берегов/городов: «шахед мимо Гостомеля» даёт
    // пин в Гостомеле и луч по маршруту, а не безликую точку «Київщина».
    if (route) {
      const confirmedVec = confirmed;
        const wMain = confirmedVec ? 2 : 1.5;
        const oMain = confirmedVec ? 0.55 : 0.28;
        const oTip = confirmedVec ? 0.8 : 0.45;
        const dx = route.to[0] - route.from[0], dy = route.to[1] - route.from[1];
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const end = [route.from[0] + dx * 0.6, route.from[1] + dy * 0.6];
        // Фактическая скорость измеренного трека: её используют и ETA, и анимация.
        const trkKmh = route.isTrack && Number.isFinite(route.track.speed_kmh)
          ? route.track.speed_kmh : null;
        const eta = etaMinutes(route.from, route.to, top.type, trkKmh);
        L.polyline([route.from, end], {
          color: color, weight: wMain, opacity: oMain, dashArray: '2 7', lineCap: 'round',
        }).addTo(vectorLayer)
          .bindTooltip(`➤ ${route.fromName} → ${route.toName} · ≈${eta} хв (орієнтовно${trkKmh ? ` · ~${Math.round(trkKmh)} км/год` : ''})`, { direction: 'top' });
        // наконечник стрелки
        const w = 0.05, d = 0.09;
        const left = [end[0] - ux * d - uy * w, end[1] - uy * d + ux * w];
        const right = [end[0] - ux * d + uy * w, end[1] - uy * d - ux * w];
        L.polyline([left, end, right], { color: color, weight: wMain, opacity: oTip }).addTo(vectorLayer);
        // анимированная точка со шлейфом вдоль луча
        spawnAnimDots(route.from, end, color, top.type, trkKmh);
    }
  });

  const counter = document.getElementById('counter');
  counter.style.color = criticalCount > 0 ? '#ff3b30' : '#ff9f0a';
  counter.textContent = minutesAgo === 0
    ? `${visible.length} актив. · ${scrubbed.length} подій (30 хв)`
    : `${scrubbed.length} подій · −${minutesAgo} хв`;

  if (minutesAgo === 0) {
    checkPersonalRadius(groups);
    renderReports();
  }
}

// === Тикер событий (бегущая строка + раскрытие) ===
// Текст события приходит уже публичным от /api/threats (правило №6), но
// автономная карта и старые данные могут содержать сырой markdown и
// служебные слова. JS-зеркало fast_filter.public_text: страховка на
// клиенте — ссылки/имена каналов/префиксы в тикер не попадают никогда.
const _SERVICE_PREFIX_JS = /^\s*(?:multi|unknown)\s*:\s*/i;
const _MD_LINK_JS = /\[([^\]\n]{0,120})\]\([^)\n]{0,300}\)/g;
const _URL_JS = /\b(?:https?:)?\/\/[^\s]{2,120}|\bwww\.[^\s]{2,120}/g;
const _SIG_DECOR_JS = '✙✠✞✜❖◆◇◈★☆✦✧†✝';
const _DECORATED_SIG_JS = new RegExp(`\\s*[${_SIG_DECOR_JS}]\\s*[^\\n]{0,60}?\\s*[${_SIG_DECOR_JS}]\\s*`, 'g');
const _TME_MD_JS = /\s*\[[^\]\n]{0,80}\]\(\s*(?:https?:)?\/\/t\.me\/[^\)\s]+\s*\)/g;
const _TME_URL_JS = /\s*(?:https?:)?\/\/t\.me\/\S+/g;

function publicTextJS(text, max = 60) {
  let s = String(text || '');
  // Подписи каналов: t.me-ссылки (markdown и голые) и декоративные вставки.
  s = s.replace(_TME_MD_JS, ' ').replace(_TME_URL_JS, ' ');
  for (let i = 0; i < 2; i++) s = s.replace(_DECORATED_SIG_JS, ' ');
  // Markdown-ссылки: имя оставляем, URL вырезаем; голые URL — прочь.
  s = s.replace(_MD_LINK_JS, '$1').replace(_URL_JS, ' ');
  // Служебные префиксы агрегатора и markdown жирного.
  s = s.replace(_SERVICE_PREFIX_JS, '').replaceAll('**', '');
  // Одна строка: переносы/двойные пробелы после вырезанных блоков,
  // ведущие «: » после срезанной атрибуции.
  s = s.replace(/\s+/g, ' ').replace(/^[\s:;,.\-–—]+/, '').trim();
  if (s.length <= max) return s;
  const cut = s.slice(0, max);
  const trimmed = cut.lastIndexOf(' ') > max * 0.5 ? cut.slice(0, cut.lastIndexOf(' ')) : cut;
  return trimmed.trimEnd().replace(/[ ,;:.!«»()[\]-]+$/, '') + '…';
}

function renderTicker() {
  const el = document.getElementById('tickerInner');
  const ticker = document.getElementById('ticker');
  const events = threatsCache.slice().sort((a, b) => a.age_min - b.age_min).slice(0, 8);
  if (!events.length) {
    el.innerHTML = ' тихо — активних повідомлень немає ';
    return;
  }
  const line = t =>
    `<b>${fmtClock(t.age_min)}</b> — ${escapeHtml(TYPE_LABELS[t.type] || '🚨')} · ${escapeHtml(REGION_NAMES[t.region] || t.region)}: ${escapeHtml(publicTextJS(t.text, 60))}`;
  if (ticker.classList.contains('expanded')) {
    el.innerHTML = events.map(t => `<div class="tick-line">${line(t)}</div>`).join('');
  } else {
    el.innerHTML = events.map(line).join(' &nbsp;·&nbsp; ');
  }
}
document.getElementById('ticker').addEventListener('click', () => {
  tapFeedback();
  document.getElementById('ticker').classList.toggle('expanded');
  renderTicker();
});

// === Bottom Sheet ===
const sheet = document.getElementById('sheet');
function closeSheet() { sheet.classList.remove('open'); }
document.getElementById('sheetClose').addEventListener('click', () => { tapFeedback(); closeSheet(); });
(function () {
  let startY = null;
  const grab = document.getElementById('sheetGrab');
  grab.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  grab.addEventListener('touchmove', e => {
    if (startY != null && e.touches[0].clientY - startY > 48) { closeSheet(); startY = null; }
  }, { passive: true });
  grab.addEventListener('touchend', () => { startY = null; }, { passive: true });
})();

function forecastHtml(regionSlug) {
  // Статистика волн региона: «коли відбій» и «коли наступна хвиля».
  // Значения приходят числами из БД проекта; всё равно приводим к int.
  const fc = forecastCache && forecastCache[regionSlug];
  if (!fc) return '';
  const sd = parseInt(fc.standdown_min, 10);
  const nw = parseInt(fc.next_wave_min, 10);
  const parts = [];
  if (Number.isFinite(sd) && sd >= 0) {
    if (sd === 0) {
      parts.push('⏳ відбій очікується будь-якої хвилини');
    } else if (fc.standdown_live) {
      // Живой countdown: цель в воздухе, медиана не исчерпана.
      parts.push(`⏳ відбій орієнтовно за <b>~${sd} хв</b>`);
    } else {
      parts.push(`⏳ типовий час «остання ціль → відбій» <b>~${sd} хв</b>`);
    }
  }
  if (Number.isFinite(nw) && nw > 0) {
    parts.push(`🔁 наступна хвиля імовірна через <b>~${nw} хв</b>`);
  }
  // Честная метрика точности прогноза (leave-one-out по истории региона).
  const hits = parseInt(fc.standdown_hits, 10), total = parseInt(fc.standdown_total, 10);
  if (Number.isFinite(hits) && Number.isFinite(total) && total > 0) {
    parts.push(`🎯 відбій у межах медіани: ${hits}/${total} епізодів`);
  }
  // Профиль «часы волн»: когда тревоги начинаются чаще всего (Київ).
  const wh = fc.wave_hours;
  if (wh && Number.isFinite(parseInt(wh.from, 10)) && Number.isFinite(parseInt(wh.to, 10))) {
    const f = String(parseInt(wh.from, 10)).padStart(2, '0');
    const t = String(parseInt(wh.to, 10)).padStart(2, '0');
    parts.push(`🌙 хвилі зазвичай ~${f}:00–${t}:00`);
  }
  if (!parts.length) return '';
  return `<div style="margin-top:6px;font-size:11.5px;color:#9fd0e8">` +
    `${parts.join(' · ')} <span style="color:#667">(статистика регіону)</span></div>`;
}

function regionTooltip(pin, items) {
  // Тултип пина региона: название + метка свежести «N хв тому»
  // + живой countdown отбоя, если он есть.
  let label = `📍 ${pin.label}`;
  if (items && items.length) {
    const fresh = Math.min(...items.map(t => Number(t.age_min) || 0));
    label += ` · ${fresh} хв тому`;
  }
  // Измеренный трек региона: курс и фактическая скорость в тултипе пина.
  const trk = (items || []).find(t => t.track && Number.isFinite(t.track.speed_kmh));
  if (trk) label += ` · ➤ ${Math.round(trk.track.course_deg)}° · ${Math.round(trk.track.speed_kmh)} км/год (орієнтовно)`;
  const fc = forecastCache && forecastCache[pin.region];
  if (fc && fc.standdown_live) {
    const sd = parseInt(fc.standdown_min, 10);
    label += Number.isFinite(sd) && sd > 0
      ? ` · 🟢 відбій ~${sd} хв`
      : ' · 🟢 відбій будь-якої хвилини';
  }
  return label;
}

// Маркеры «цель уже назначена / летит НА объект»: шахед «на Дарницю» —
// это направление атаки, показываем бейдж, а не безликую точку.
const APPROACH_MARKERS = [
  'курсом на', 'курсом у', 'на підході', 'на подходе', 'летить на', 'летят на',
  'летять на', 'летит в', 'летят в', 'рухається на', 'движется на', 'в напрямку',
  'в сторону', 'на направлении', 'зашли на', 'заходять на', 'цель —', 'цель -',
  'ціль —', 'ціль -', 'на дарниц', 'маршрут на',
];
function approachOf(text) {
  const lower = (text || '').toLowerCase();
  return APPROACH_MARKERS.some(m => lower.includes(m));
}

function openThreatSheet(pin, items) {
  let top = items[0];
  items.forEach(t => {
    if (SEVERITY_ORDER[TYPE_LEVEL[t.type]] > SEVERITY_ORDER[TYPE_LEVEL[top.type]]) top = t;
  });
  const lvl = LEVELS[TYPE_LEVEL[top.type]] || LEVELS.info;
  const confirmed = items.some(t => Number(t.sources || 1) >= 2);
  document.getElementById('sheetTitle').innerHTML =
    `${escapeHtml(pin.label)} <span class="lvl" style="color:${lvl.color};background:${lvl.bg}">${lvl.label}</span>`;
  const eta = pin.isCity ? null : routeOf(top, pin);
  let etaLine = '';
  if (['uav', 'rockets'].includes(layerOf(top)) && eta) {
    // С измеренным треком показываем фактическую скорость и ETA по ней.
    const trkKmh = eta.isTrack && Number.isFinite(eta.track.speed_kmh)
      ? eta.track.speed_kmh : null;
    const kmhPart = trkKmh ? ` · ~${Math.round(trkKmh)} км/год` : '';
    etaLine = ` · ≈${etaMinutes(eta.from, eta.to, top.type, trkKmh)} хв до ${eta.toName} (орієнтовно${kmhPart})`;
  }
  // Одиночный источник не помечаем: «одне джерело» в каждой карточке — шум.
  // Подтверждение несколькими источниками по-прежнему показываем.
  document.getElementById('sheetMeta').textContent =
    `${items.length} подія(й)${confirmed ? ' · підтверджено кількома джерелами' : ''}${etaLine}`;
  document.getElementById('sheetBody').innerHTML = items.slice(0, 6).map(t =>
    `<div class="ev"><div class="t">${fmtClock(t.age_min)} · ${t.age_min} хв тому · джерел: ${escapeHtml(t.sources)}</div>` +
    `${escapeHtml(TYPE_LABELS[t.type] || t.type)}<br>${escapeHtml((t.text || '').replaceAll('**', ''))}</div>`
  ).join('') + forecastHtml(pin.region);
  document.getElementById('sheetNote').textContent = pin.isCity
    ? 'Позначка — місто/район із тексту джерела (орієнтовно). Дані — повідомлення відкритих джерел.'
    : 'Позначка — центр регіону, не точні координати. Дані — повідомлення відкритих джерел.';
  document.getElementById('sheetActions').innerHTML =
    `<a href="${CHANNEL_URL}" target="_blank" rel="noopener">📡 Канал AirRadar AI</a>`;
  sheet.classList.add('open');
}

// === Репорты пользователей: слой «👤 Повідомлення» ===
function renderReports() {
  reportsLayer.clearLayers();
  if (minutesAgo !== 0) return; // плейбэк показывает только источники
  reportsCache.forEach(r => {
    const marker = L.circleMarker([r.lat, r.lon], {
      color: '#ff2d55', fillColor: '#ff2d55', fillOpacity: 0.5,
      opacity: 0.9, radius: 6, weight: 2, className: 'pulse',
    }).addTo(reportsLayer)
      .bindTooltip(`👤 Повідомлення користувача · ${r.age_min} хв тому${r.region ? ` · ${escapeHtml(r.region)}` : ''}`, { direction: 'top' });
    marker.on('click', () => { tapFeedback(); openReportSheet(r); });
  });
}

function openReportSheet(r) {
  const where = r.region || `${r.lat.toFixed(3)}, ${r.lon.toFixed(3)}`;
  document.getElementById('sheetTitle').innerHTML =
    `👤 Повідомлення користувача <span class="lvl" style="color:#ff2d55;background:rgba(255,45,85,0.18)">НЕПІДТВЕРДЖЕНО</span>`;
  document.getElementById('sheetMeta').textContent =
    `${where} · ${r.age_min} хв тому · координати округлено`;
  document.getElementById('sheetBody').innerHTML =
    `<div class="ev">${escapeHtml(r.text || 'Користувач надіслав геопозицію без опису.')}</div>` +
    `<div class="ev">Це сигнал від людини, а не від джерел: може бути помилкою. ` +
    `Перевіряй офіційні канали та сигнал повітряної тривоги.</div>`;
  document.getElementById('sheetNote').textContent =
    'Репорти збираються через бота @AirRadar_AI_bot (/report). Публікуються лише округлені координати.';
  document.getElementById('sheetActions').innerHTML =
    `<a href="https://t.me/AirRadar_AI_bot" target="_blank" rel="noopener">🤖 Повідомити в бота</a>`;
  sheet.classList.add('open');
}

// === Личный радиус безопасности: 15 км + красная вспышка ===
const PERSONAL_RADIUS_KM = 15;
document.getElementById('geoBtn').addEventListener('click', () => { tapFeedback(); requestGeo(false); });

function requestGeo(forShelters) {
  if (!navigator.geolocation) { useMapCenter(forShelters); return; }
  toast('⏳ Визначаю розташування…');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    userPos = [lat, lon];
    map.setView([lat, lon], 9);
    drawGeoCircle();
    if (forShelters) loadShelters();
    toastNearestThreats();
  }, () => useMapCenter(forShelters), { enableHighAccuracy: false, timeout: 8000 });
}

// «Що поруч зі мною»: топ-3 активні загрози з відстанню до геопозиції.
// Источник данных — pinGroupsCache, заполненный последним renderAll().
// При плейбэке (minutesAgo > 0) группы не рендерятся для тостов — берём
// кэш последнего «живого» рендера.
function toastNearestThreats() {
  if (!userPos) return;
  const near = [];
  pinGroupsCache.forEach(({ pin }) => {
    const d = distanceKm(userPos, pin.coord);
    if (d <= 120) near.push({ label: pin.label, d });
  });
  reportsCache.forEach(r => {
    const d = distanceKm(userPos, [r.lat, r.lon]);
    if (d <= 120) near.push({ label: '👤 репорт', d });
  });
  if (!near.length) { toast('✅ У радіусі 120 км активних загроз не видно'); return; }
  near.sort((a, b) => a.d - b.d);
  const top = near.slice(0, 3)
    .map(n => `${n.label} — ${n.d.toFixed(0)} км`)
    .join(' · ');
  toast(`📍 Найближчі: ${top}`);
}

// Геолокация часто недоступна внутри Telegram WebApp — fallback: центр карты.
function useMapCenter(forShelters) {
  const c = map.getCenter();
  userPos = [c.lat, c.lng];
  drawGeoCircle();
  toast('Геолокацію не надано — шукаю біля центру карти');
  if (forShelters) loadShelters();
}

function drawGeoCircle() {
  if (geoCircle) map.removeLayer(geoCircle);
  geoCircle = L.circle(userPos, {
    radius: PERSONAL_RADIUS_KM * 1000, color: '#5ac8fa', weight: 1.5,
    dashArray: '4 6', fillOpacity: 0.04,
  }).addTo(map);
}

function checkPersonalRadius(groups) {
  if (!userPos) return;
  const near = [];
  groups.forEach(({ pin }) => {
    if (distanceKm(userPos, pin.coord) <= PERSONAL_RADIUS_KM) near.push(pin.label);
  });
  // Репорты пользователей тоже считаем: точка ближе центров регионов.
  let reportNear = 0;
  if (minutesAgo === 0) {
    reportsCache.forEach(r => {
      if (distanceKm(userPos, [r.lat, r.lon]) <= PERSONAL_RADIUS_KM) reportNear++;
    });
  }
  const keys = near.slice();
  if (reportNear) keys.push(`👤 ×${reportNear}`);
  const sig = keys.slice().sort().join(',');
  if (keys.length && sig !== lastFlashKeys) {
    const flash = document.getElementById('alert-flash');
    flash.classList.remove('on');
    void flash.offsetWidth; // restart animation
    flash.classList.add('on');
    alertFeedback();
    let msg = `⚠ Загроза в радіусі ${PERSONAL_RADIUS_KM} км: ${near.join(', ')}`;
    if (reportNear) msg += ` · повідомлень користувачів поруч: ${reportNear}`;
    toast(msg, 5000);
  }
  lastFlashKeys = sig;
}

// === Слой 3: укрытия рядом (Overpass API — открытый, без ключей) ===
document.getElementById('shelterBtn').addEventListener('click', () => {
  tapFeedback();
  if (userPos) loadShelters(); else requestGeo(true);
});

function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms || 3500);
}

async function overpassQuery(query) {
  const endpoints = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
  ];
  for (const url of endpoints) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      const resp = await fetch(url, {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      if (resp.ok) return await resp.json();
    } catch (e) { /* пробуем зеркало */ }
  }
  return null;
}

async function loadShelters() {
  if (!userPos) return;
  const key = userPos.map(v => v.toFixed(2)).join(',');
  if (sheltersLoadedFor === key && sheltersLayer.getLayers().length) {
    if (!map.hasLayer(sheltersLayer)) sheltersLayer.addTo(map);
    toast(`🛡 Укриття: ${sheltersLayer.getLayers().length} точок поруч`);
    return;
  }
  toast('⏳ Шукаю укриття в радіусі 2 км…', 6000);
  const [lat, lon] = userPos;
  const data = await overpassQuery(
    `[out:json][timeout:15];(` +
    `nwr["amenity"="shelter"](around:2000,${lat},${lon});` +
    `nwr["railway"="station"]["station"="subway"](around:2000,${lat},${lon});` +
    `);out center 40;`
  );
  sheltersLayer.clearLayers();
  sheltersLoadedFor = null;
  if (!data || !data.elements || !data.elements.length) {
    toast(data ? 'Укриття в радіусі 2 км не знайдено на OpenStreetMap' : 'Сервіс укриттів недоступний, спробуйте пізніше');
    return;
  }
  const seen = new Set();
  const spots = data.elements
    .map(el => {
      const p = el.type === 'node' ? [el.lat, el.lon] : (el.center ? [el.center.lat, el.center.lon] : null);
      if (!p) return null;
      const name = (el.tags && (el.tags.name || el.tags.operator)) || 'Укриття';
      const isMetro = el.tags && el.tags.station === 'subway';
      return { p, name, isMetro, dist: distanceKm(userPos, p) };
    })
    .filter(Boolean)
    .filter(s => {
      const k = s.p[0].toFixed(4) + ',' + s.p[1].toFixed(4);
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    })
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 15);

  spots.forEach(s => {
    const marker = L.marker(s.p, {
      icon: L.divIcon({
        className: '',
        html: `<div style="font-size:16px;filter:drop-shadow(0 0 3px rgba(90,200,250,0.8))">${s.isMetro ? '🚇' : '🛡'}</div>`,
        iconSize: [20, 20], iconAnchor: [10, 10],
      }),
    }).addTo(sheltersLayer);
    marker.on('click', () => { tapFeedback(); openShelterSheet(s); });
  });
  sheltersLayer.addTo(map);
  sheltersLoadedFor = key;
  map.setView(userPos, 13);
  toast(`🛡 Знайдено укриттів: ${spots.length} (радіус 2 км)`);
}

function openShelterSheet(s) {
  const dest = `${s.p[0]},${s.p[1]}`;
  document.getElementById('sheetTitle').innerHTML =
    `${s.isMetro ? '🚇' : '🛡'} ${escapeHtml(s.name)}`;
  document.getElementById('sheetMeta').textContent =
    `≈ ${s.dist < 1 ? Math.round(s.dist * 1000) + ' м' : s.dist.toFixed(1) + ' км'} від вас · дані OpenStreetMap`;
  document.getElementById('sheetBody').innerHTML =
    'Наведіть, щоб побудувати пішохідний маршрут. У метро Києва станції використовуються як укриття.';
  document.getElementById('sheetNote').textContent =
    'Перевіряйте офіційні вказівки місцевої влади щодо найближчих укриттів.';
  document.getElementById('sheetActions').innerHTML =
    `<a href="https://www.google.com/maps/dir/?api=1&destination=${dest}&travelmode=walking" target="_blank" rel="noopener">🚶 Google Maps</a>` +
    `<a href="https://maps.apple.com/?daddr=${dest}&dirflg=w" target="_blank" rel="noopener">🍎 Apple Maps</a>`;
  sheet.classList.add('open');
}

// === Поделиться картой ===
document.getElementById('shareBtn').addEventListener('click', async () => {
  tapFeedback();
  const shareData = {
    title: 'AirRadar AI',
    text: '🗺 Жива карта загроз України — AirRadar AI',
    url: location.href.split('#')[0],
  };
  try {
    if (navigator.share) { await navigator.share(shareData); return; }
    await navigator.clipboard.writeText(shareData.url);
    toast('🔗 Посилання на карту скопійовано');
  } catch (e) { /* пользователь отменил */ }
});

// === Старт ===
try {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
} catch (e) { /* браузер вне Telegram */ }
const soundChip = document.querySelector('#layersPanel .chip[data-layer="sound"]');
if (soundChip && !soundOn) soundChip.textContent = '🔇';

fetchData();
// Нет API — обновление через перезапуск generate_map.py
// Возврат на вкладку/в Telegram — мгновенное обновление, не ждём таймер.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fetchData();
});
</script>
