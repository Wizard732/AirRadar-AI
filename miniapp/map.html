<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AirRadar AI — Карта загроз</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #1a1a2e; font-family: -apple-system, sans-serif; color: #fff; }
  #map { width: 100%; height: 100vh; z-index: 1; }
  #header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(26,26,46,0.92); padding: 10px 16px; backdrop-filter: blur(10px);
    display: flex; justify-content: space-between; align-items: center;
  }
  #header h1 { font-size: 16px; font-weight: 700; }
  #header .count { font-size: 13px; color: #ff9f0a; }
  #legend {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(26,26,46,0.92); padding: 8px 16px; font-size: 12px;
    display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
  }
  .leg-item { display: flex; align-items: center; gap: 4px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; }
  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%{opacity:1} 50%{opacity:0.3} 100%{opacity:1} }
  #filters {
    position: absolute; top: 52px; right: 10px; z-index: 1000;
    display: flex; flex-direction: column; gap: 6px;
  }
  .chip {
    background: rgba(26,26,46,0.92); border: 1px solid #3a3a5c; color: #fff;
    padding: 6px 10px; border-radius: 16px; font-size: 12px; cursor: pointer;
    user-select: none; backdrop-filter: blur(8px);
  }
  .chip.off { opacity: 0.4; text-decoration: line-through; }
  #geoBtn {
    position: absolute; bottom: 52px; right: 10px; z-index: 1000;
    background: rgba(26,26,46,0.92); border: 1px solid #3a3a5c; color: #fff;
    padding: 8px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
  }
  #timeline {
    position: absolute; bottom: 26px; left: 10px; right: 10px; z-index: 1000;
    display: flex; align-items: center; gap: 8px;
    background: rgba(26,26,46,0.92); padding: 6px 12px; border-radius: 12px;
    font-size: 12px;
  }
  #timeline input[type=range] { flex: 1; accent-color: #ff9500; }
</style>
</head>
<body>

<div id="header">
  <h1>🛡 AirRadar AI — Карта загроз</h1>
  <div class="count" id="counter">— загроз</div>
</div>

<div id="map"></div>

<div id="filters">
  <div class="chip" data-layer="rockets">🔴 Ракети / Балістика</div>
  <div class="chip" data-layer="uav">🟡 БПЛА / Дрони</div>
  <div class="chip" data-layer="alerts">🟢 Тривоги / Інше</div>
</div>
<button id="geoBtn" type="button">📍 Моє розташування</button>

<div id="timeline">
  <span>⏱</span>
  <input id="tlRange" type="range" min="0" max="120" step="5" value="0">
  <span id="tlLabel">зараз</span>
</div>

<div id="legend">
  <div class="leg-item"><div class="leg-dot pulse" style="background:#ff3b30"></div> Балістика/ракета</div>
  <div class="leg-item"><div class="leg-dot pulse" style="background:#ff9500"></div> БПЛА/Shahed</div>
  <div class="leg-item"><div class="leg-dot" style="background:#ffcc00"></div> КАБ/авіація</div>
  <div class="leg-item"><div class="leg-dot" style="background:#34c759"></div> Відбій</div>
  <div class="leg-item"><div class="leg-dot" style="background:#ff2d55"></div> Вибух/прильот</div>
</div>

<script>
// === Координаты центров регионов Украины ===
const REGION_COORDS = {
  kyivska: [50.45, 30.52],
  sumska: [50.91, 34.80],
  kharkivska: [49.99, 36.23],
  chernigivska: [51.49, 31.29],
  odeska: [46.48, 30.73],
  dnipropetrovska: [48.46, 35.05],
  zhytomyrska: [50.25, 28.66],
  vinnytska: [49.23, 28.48],
  lvivska: [49.84, 24.03],
  poltavska: [49.59, 34.55],
  cherkaska: [49.44, 32.06],
  rivnenska: [50.62, 26.25],
  volynska: [50.75, 25.33],
  khmelnytska: [49.42, 27.00],
  ternopilska: [49.55, 25.59],
  ivano_frankivska: [48.92, 24.71],
  zakarpatska: [48.62, 22.29],
  mykolaivska: [46.97, 32.00],
  khersonska: [46.64, 32.62],
  zaporizka: [47.84, 35.14],
  kirovohradska: [48.51, 32.26],
  donetska: [48.00, 37.80],
  luhanska: [48.57, 39.31],
  crimea: [44.95, 34.10],
};

// Цвета по типу угрозы
const TYPE_COLORS = {
  ballistic: '#ff3b30', cruise_missile: '#ff3b30', missile: '#ff3b30',
  shahed: '#ff9500', uav: '#ff9500', fpv: '#ff9500',
  kab: '#ffcc00', aviation: '#ffcc00',
  explosion: '#ff2d55',
  alert: '#ffcc00', stand_down: '#34c759',
  mlrs: '#ff3b30', artillery: '#ff3b30',
  air_defense: '#5ac8fa', recon_drone: '#8e8e93',
  other: '#8e8e93',
};

const TYPE_LABELS = {
  ballistic: '🚀 Балістика', cruise_missile: '🚀 Крилаті', missile: '🚀 Ракета',
  shahed: '🛸 Shahed', uav: '🛸 БПЛА', fpv: '🛸 ФПВ',
  kab: '✈️ КАБ', aviation: '✈️ Авіація',
  explosion: '💥 Вибух', alert: '🟡 Тривога', stand_down: '🟢 Відбій',
  mlrs: '🔴 РСЗО', artillery: '🔴 Арта', air_defense: '🛡 ППО',
  recon_drone: '👁 Розвідка', other: '🚨 Інше',
};

// Same HTTPS origin as this Mini App; never use the user's localhost.
const API_URL = '/api/threats';

// === Слои-фильтры ===
const layerOf = t => {
  if (['ballistic','cruise_missile','missile','mlrs','artillery'].includes(t.type)) return 'rockets';
  if (['shahed','uav','fpv','recon_drone'].includes(t.type)) return 'uav';
  return 'alerts';
};
const enabled = { rockets: true, uav: true, alerts: true };
document.querySelectorAll('#filters .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const layer = chip.dataset.layer;
    enabled[layer] = !enabled[layer];
    chip.classList.toggle('off', !enabled[layer]);
    updateMap();
  });
});

// === Таймлайн-плейбэк (0 = сейчас, 120 = 2 часа назад) ===
let minutesAgo = 0;
const tlRange = document.getElementById('tlRange');
const tlLabel = document.getElementById('tlLabel');
tlRange.addEventListener('input', () => {
  minutesAgo = parseInt(tlRange.value, 10);
  tlLabel.textContent = minutesAgo === 0 ? 'зараз' : `−${minutesAgo} хв`;
  updateMap();
});

// Инициализация карты
const map = L.map('map', { zoomControl: false }).setView([48.5, 32.0], 6);
L.control.zoom({ position: 'topright' }).addTo(map);
// Esri World Dark Gray — тёмная подложка без API-ключей (CartoDB с 2025
// требует ключ и отдаёт заглушку «api key required»).
L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  {
    attribution: 'Esri, HERE, Garmin | AirRadar AI',
    maxZoom: 16,
  },
).addTo(map);

let markersLayer = L.layerGroup().addTo(map);
let geoCircle = null;

// === «Моё местоположение»: центр на пользователе + радиус 10 км ===
document.getElementById('geoBtn').addEventListener('click', () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    map.setView([lat, lon], 10);
    if (geoCircle) map.removeLayer(geoCircle);
    geoCircle = L.circle([lat, lon], {
      radius: 10000, color: '#5ac8fa', weight: 1, fillOpacity: 0.05,
    }).addTo(map);
  }, () => {}, { enableHighAccuracy: false, timeout: 8000 });
});

function escapeHtml(value) {
  const node = document.createElement('span');
  node.textContent = value || '';
  return node.innerHTML;
}

// === Обновление данных ===
async function updateMap() {
  try {
    const resp = await fetch(`${API_URL}?minutes=120`);
    const data = await resp.json();
    let threats = (data.threats || []).filter(t => {
      // Плейбэк: окно ±2 минуты вокруг выбранного момента таймлайна;
      // «зараз» — всё за последние 30 минут (обычный режим).
      if (minutesAgo === 0) return t.age_min <= 30;
      return Math.abs(t.age_min - minutesAgo) <= 2;
    });

    document.getElementById('counter').textContent = `${threats.length} загроз (${data.window_min || 120} хв)`;

    // Очищаем старые маркеры.
    markersLayer.clearLayers();

    threats.forEach(t => {
      const coords = REGION_COORDS[t.region];
      if (!coords) return;
      if (!enabled[layerOf(t)]) return;

      const color = TYPE_COLORS[t.type] || '#8e8e93';
      const label = TYPE_LABELS[t.type] || t.type;
      const isPulse = t.age_min < 10; // свежие пульсируют
      // Достоверность: один источник — полупрозрачный «подозрение на цель»,
      // несколько — плотный маркер.
      const confirmed = Number(t.sources || 1) >= 2;
      const opacity = confirmed ? 0.6 : 0.25;

      // Маркер региона
      const marker = L.circleMarker(coords, {
        color: color,
        fillColor: color,
        fillOpacity: opacity,
        opacity: confirmed ? 1 : 0.4,
        radius: isPulse ? 12 : 8,
        className: isPulse ? 'pulse' : '',
      }).addTo(markersLayer);

      // Popup с инфо
      marker.bindPopup(
        `<b>${escapeHtml(label)}</b><br>${escapeHtml(t.text)}<br>` +
        `<i>${t.age_min} хв тому · ${confirmed ? 'підтверджено ' + t.sources + ' джерелами' : 'одне джерело — очікує підтвердження'}</i><br>` +
        `<small>Позначка показує центр регіону, не точні координати.</small>`,
        { className: 'threat-popup' }
      );

    });

    // Обновляем счётчик красным если есть CRITICAL
    if (threats.some(t => ['ballistic', 'cruise_missile', 'missile', 'explosion', 'mlrs'].includes(t.type))) {
      document.getElementById('counter').style.color = '#ff3b30';
    } else {
      document.getElementById('counter').style.color = '#ff9f0a';
    }
  } catch (e) {
    document.getElementById('counter').textContent = '⚠ Помилка з\'єднання';
    document.getElementById('counter').style.color = '#ff3b30';
  }
}

// Первая отрисовка + обновление каждые 30 сек
updateMap();
setInterval(updateMap, 30000);
</script>
</body>
</html>
