<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>AirRadar — Радар шахедів</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#0b0e14; --panel:rgba(16,20,30,.92); --line:rgba(255,255,255,.10); --txt:#eef1f6; --dim:#8b95a8;
          --red:#ff3b30; --orange:#ff9f0a; --yellow:#ffd60a; --cyan:#5ac8fa; --green:#30d158; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--txt); font:14px -apple-system,'Segoe UI',sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; background:var(--bg); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px); }

  #hud { position:absolute; top:10px; left:10px; right:10px; z-index:1000; display:flex; gap:8px; align-items:flex-start; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  #status { padding:9px 12px; flex:1; min-width:0; }
  #status b { font-size:15px; }
  #status .sub { color:var(--dim); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn { padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); font:inherit; cursor:pointer; }
  .btn.on { border-color:var(--cyan); color:var(--cyan); }
  .btn:active { transform:scale(.97); }

  #banner { position:absolute; top:70px; left:10px; right:10px; z-index:1100; display:none; padding:12px 14px; border-radius:14px; font-weight:600; line-height:1.35; }
  #banner.imminent, #banner.over { background:rgba(255,59,48,.94); animation:pulse 1s infinite; }
  #banner.watch { background:rgba(255,159,10,.94); color:#1a1200; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(255,59,48,.35); } }

  #ticker { position:absolute; left:10px; right:10px; bottom:112px; z-index:1000; padding:7px 12px; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ticker b { color:var(--yellow); font-weight:600; }

  #timebar { position:absolute; left:10px; right:10px; bottom:10px; z-index:1000; padding:10px 12px; }
  #timebar .row { display:flex; gap:8px; align-items:center; }
  #timebar input[type=range] { flex:1; accent-color:var(--cyan); height:28px; }
  #clock { min-width:96px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  #clock.live { color:var(--green); } #clock.past { color:var(--orange); }
  select.btn { padding:8px 6px; }

  #sheet { position:absolute; left:10px; right:10px; bottom:170px; z-index:1200; padding:14px; display:none; max-height:45vh; overflow:auto; }
  #sheet h3 { font-size:16px; margin-bottom:6px; }
  #sheet .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; }
  #sheet .kv span:nth-child(odd) { color:var(--dim); }
  #sheet .close { position:absolute; top:8px; right:12px; font-size:20px; color:var(--dim); cursor:pointer; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { padding:3px 9px; border-radius:999px; background:rgba(255,214,10,.14); color:var(--yellow); font-size:12px; }
  .note { margin-top:8px; font-size:11px; color:var(--dim); }

  .sh { position:relative; width:46px; height:46px; }
  .sh svg { width:46px; height:46px; overflow:visible; filter:drop-shadow(0 0 6px var(--glow,#ff3b30)); transition:opacity .4s; }
  .sh.stale svg { opacity:.4; filter:grayscale(1); }
  .sh .cnt { position:absolute; right:-6px; top:-6px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:#fff; color:#111; font:700 11px/18px sans-serif; text-align:center; }
  .sh .unk { position:absolute; inset:0; display:grid; place-items:center; font:700 18px sans-serif; color:#fff; }
  .prop { transform-origin:32px 50px; animation:spin .12s linear infinite; }
  @keyframes spin { to { transform:rotate(180deg); } }
  .lbl { background:rgba(10,12,18,.85); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:2px 6px; font-size:11px; white-space:nowrap; }
  .leaflet-container { font:inherit; }
  .me { width:18px; height:18px; border-radius:50%; background:var(--cyan); border:3px solid #fff; box-shadow:0 0 0 6px rgba(90,200,250,.3); }
  .leaflet-control-attribution { font-size:9px; opacity:.6; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div id="status" class="panel"><b id="st-main">Радар шахедів</b><div class="sub" id="st-sub">завантаження…</div></div>
  <button class="btn" id="btn-me" title="Стежити за моєю точкою">🛡</button>
  <button class="btn" id="btn-snd" title="Звук">🔔</button>
</div>
<div id="banner" class="panel"></div>
<div id="sheet" class="panel"><span class="close" id="sheet-x">×</span><div id="sheet-body"></div></div>
<div id="ticker" class="panel"></div>
<div id="timebar" class="panel">
  <div class="row">
    <button class="btn" id="btn-back" title="Назад на 15 хв">⏪</button>
    <button class="btn" id="btn-play" title="Відтворити історію">▶</button>
    <select class="btn" id="speed"><option value="1">×1</option><option value="10">×10</option><option value="30" selected>×30</option><option value="90">×90</option></select>
    <input type="range" id="scrub" min="0" max="1000" value="1000">
    <button class="btn" id="btn-live">LIVE</button>
  </div>
  <div class="row" style="margin-top:4px;justify-content:space-between;color:var(--dim);font-size:12px">
    <span id="t-from"></span><span id="clock" class="live"></span>
  </div>
</div>

<script>
'use strict';
const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');
const WINDOW_MIN = Math.min(720, Math.max(30, +params.get('minutes') || 360));
const KEEP_AFTER_S = 25 * 60;       // трек живёт на экране после последней точки
const EXTRAPOLATE_MAX_S = 20 * 60;  // дальше не «дорисовываем» курс
const R_EARTH = 6371;

// ---------- геометрия ----------
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dl = rad(b[0]-a[0]), dn = rad(b[1]-a[1]);
  const h = Math.sin(dl/2)**2 + Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dn/2)**2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const la1 = rad(a[0]), la2 = rad(b[0]), dn = rad(b[1]-a[1]);
  const y = Math.sin(dn)*Math.cos(la2), x = Math.cos(la1)*Math.sin(la2) - Math.sin(la1)*Math.cos(la2)*Math.cos(dn);
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function dest(a, brg, km) {
  const la1 = rad(a[0]), lo1 = rad(a[1]), b = rad(brg), d = km / R_EARTH;
  const la2 = Math.asin(Math.sin(la1)*Math.cos(d) + Math.cos(la1)*Math.sin(d)*Math.cos(b));
  const lo2 = lo1 + Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la1), Math.cos(d) - Math.sin(la1)*Math.sin(la2));
  return [deg(la2), ((deg(lo2) + 540) % 360) - 180];
}
const angDiff = (a, b) => Math.abs(((a - b + 180) % 360 + 360) % 360 - 180);
const COMPASS = ['північ','північний схід','схід','південний схід','південь','південний захід','захід','північний захід'];
const compass = d => COMPASS[Math.floor(((d % 360) + 22.5) / 45) % 8];

// ---------- состояние ----------
let tracks = [], serverNow = Math.floor(Date.now()/1000), fetchedAt = Date.now();
let viewTs = null;            // null = LIVE
let playing = false, selectedId = null;
const nowTs = () => serverNow + (Date.now() - fetchedAt) / 1000;
const curTs = () => viewTs === null ? nowTs() : viewTs;
const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString('uk-UA', { hour:'2-digit', minute:'2-digit' });
const fmtClock = ts => new Date(ts * 1000).toLocaleTimeString('uk-UA', { hour:'2-digit', minute:'2-digit', second:'2-digit' });

// Положение цели в момент ts: интерполяция по точкам, затем экстраполяция по курсу.
function positionAt(t, ts) {
  const p = t.points;
  if (ts < p[0].ts || ts > p[p.length-1].ts + KEEP_AFTER_S) return null;
  for (let i = 0; i < p.length - 1; i++) {
    if (ts >= p[i].ts && ts <= p[i+1].ts) {
      const k = p[i+1].ts === p[i].ts ? 0 : (ts - p[i].ts) / (p[i+1].ts - p[i].ts);
      return { ll: [p[i].lat + (p[i+1].lat - p[i].lat)*k, p[i].lon + (p[i+1].lon - p[i].lon)*k], est: false, stale: false };
    }
  }
  const last = p[p.length-1], dt = ts - last.ts;
  const stale = dt > KEEP_AFTER_S * 0.8;
  if (t.heading === null || stale) return { ll: [last.lat, last.lon], est: false, stale: dt > 10*60 };
  return { ll: dest([last.lat, last.lon], t.heading, t.speed_kmh * Math.min(dt, EXTRAPOLATE_MAX_S) / 3600), est: true, stale: false };
}

// ---------- карта ----------
const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([49.0, 32.0], 6);
L.control.zoom({ position: 'bottomright' }).addTo(map);
// Тайлы без ключей и регистрации: CARTO dark -> OSM -> Esri. При ошибке плитки слой переключается на следующий.
const TILE_SOURCES = [
  { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', o: { subdomains: 'abcd', attribution: '© OpenStreetMap, © CARTO | AirRadar AI', maxZoom: 18 } },
  { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', o: { attribution: '© OpenStreetMap | AirRadar AI', maxZoom: 18 } },
  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', o: { attribution: 'Esri | AirRadar AI', maxZoom: 16 } },
];
let tileIdx = 0, tileErrs = 0, tileLayer = null;
function useTiles(i) {
  if (tileLayer) map.removeLayer(tileLayer);
  tileIdx = i; tileErrs = 0;
  tileLayer = L.tileLayer(TILE_SOURCES[i].url, TILE_SOURCES[i].o).addTo(map);
  tileLayer.on('tileerror', () => { if (++tileErrs >= 4 && tileIdx + 1 < TILE_SOURCES.length) useTiles(tileIdx + 1); });
  tileLayer.on('tileload', () => { tileErrs = 0; });
}
useTiles(0);
const trailLayer = L.layerGroup().addTo(map), fcLayer = L.layerGroup().addTo(map), meLayer = L.layerGroup().addTo(map);
const markers = new Map();   // id -> { marker, el, svg }

function shahedIcon(t) {
  const reactive = t.profile === 'reactive';
  const color = reactive ? '#ff6b1a' : '#ff3b30';
  const known = t.heading !== null;
  const svg = `
    <svg viewBox="0 0 64 64" class="body" style="--glow:${color}">
      <path d="M32 2 L61 51 L53 54 L32 45 L11 54 L3 51 Z" fill="${color}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M32 2 L36 41 L32 46 L28 41 Z" fill="#1b1f2a" opacity=".85"/>
      <path d="M61 51 L63 43 L57 48 Z M3 51 L1 43 L7 48 Z" fill="#fff" opacity=".9"/>
      <ellipse class="prop" cx="32" cy="50" rx="8" ry="1.8" fill="#fff" opacity=".75"/>
    </svg>`;
  const count = t.count > 1 ? `<span class="cnt">${t.count}</span>` : '';
  const unk = known ? '' : '<span class="unk">?</span>';
  return L.divIcon({ className: '', iconSize: [46, 46], iconAnchor: [23, 23], html: `<div class="sh">${svg}${unk}${count}</div>` });
}

function renderTracks() {
  const ts = curTs();
  const seen = new Set();
  let active = 0, reactive = 0;
  for (const t of tracks) {
    const pos = positionAt(t, ts);
    if (!pos) continue;
    seen.add(t.id);
    if (!pos.stale) { active++; if (t.profile === 'reactive') reactive++; }
    let m = markers.get(t.id);
    if (!m) {
      const marker = L.marker(pos.ll, { icon: shahedIcon(t), zIndexOffset: 500, keyboard: false }).addTo(map);
      marker.on('click', () => openSheet(t.id));
      marker.bindTooltip('', { direction: 'right', offset: [20, 0], className: 'lbl', permanent: false });
      m = { marker, sig: iconSig(t) };
      markers.set(t.id, m);
    }
    if (m.sig !== iconSig(t)) { m.marker.setIcon(shahedIcon(t)); m.sig = iconSig(t); }
    m.marker.setLatLng(pos.ll);
    const el = m.marker.getElement();
    if (el) {
      const box = el.querySelector('.sh'), body = el.querySelector('.body');
      box.classList.toggle('stale', pos.stale);
      if (body) body.style.transform = `rotate(${t.heading === null ? 0 : t.heading}deg)`;
    }
    m.marker.setTooltipContent(tipText(t, pos));
    m.pos = pos;
  }
  for (const [id, m] of markers) if (!seen.has(id)) { map.removeLayer(m.marker); markers.delete(id); }
  return { active, reactive };
}
const iconSig = t => `${t.profile}|${t.count}|${t.heading === null ? 'u' : 'k'}`;
function tipText(t, pos) {
  const v = t.speed_kmh ? `${Math.round(t.speed_kmh)} км/год${t.speed_source === 'measured' ? '' : '~'}` : '';
  return `${t.profile === 'reactive' ? 'Реактивний' : (t.weapon === 'shahed' ? 'Шахед' : 'БпЛА')}${t.count > 1 ? ' ×' + t.count : ''} · ${v}${t.heading !== null ? ' · ' + compass(t.heading) : ''}`;
}

function drawTrailsAndForecast(ts) {
  trailLayer.clearLayers(); fcLayer.clearLayers();
  for (const t of tracks) {
    const m = markers.get(t.id); if (!m || !m.pos) continue;
    const color = t.profile === 'reactive' ? '#ff6b1a' : '#ff3b30';
    const pts = t.points.filter(p => p.ts <= ts).map(p => [p.lat, p.lon]);
    pts.push(m.pos.ll);
    if (pts.length > 1) L.polyline(pts, { color, weight: 2.5, opacity: m.pos.stale ? .25 : .75 }).addTo(trailLayer);
    for (const p of t.points) if (p.ts <= ts) L.circleMarker([p.lat, p.lon], { radius: 2.5, color, weight: 0, fillOpacity: .8 }).addTo(trailLayer);
    if (t.heading === null || m.pos.stale) continue;
    // Луч прогноза на 45 мин по курсу и коридор ±12 км вокруг него.
    const len = Math.min(t.speed_kmh * 45 / 60, 260);
    const end = dest(m.pos.ll, t.heading, len);
    L.polyline([m.pos.ll, end], { color: '#ffd60a', weight: 2, dashArray: '6 8', opacity: .85 }).addTo(fcLayer);
    const poly = [dest(m.pos.ll, t.heading - 90, 12), dest(end, t.heading - 90, 12), dest(end, t.heading + 90, 12), dest(m.pos.ll, t.heading + 90, 12)];
    L.polygon(poly, { color: '#ffd60a', weight: 0, fillColor: '#ffd60a', fillOpacity: selectedId === t.id ? .16 : .06, interactive: false }).addTo(fcLayer);
    if (viewTs === null) for (const f of t.forecast || []) {
      L.circleMarker([f.lat, f.lon], { radius: 4, color: '#ffd60a', weight: 1.5, fillColor: '#0b0e14', fillOpacity: 1 })
        .bindTooltip(`${f.name} · ~${f.eta_min} хв`, { permanent: selectedId === t.id, direction: 'top', className: 'lbl' }).addTo(fcLayer);
    }
  }
}

// ---------- панель цели ----------
const sheet = document.getElementById('sheet'), sheetBody = document.getElementById('sheet-body');
function openSheet(id) { selectedId = id; renderSheet(); sheet.style.display = 'block'; }
document.getElementById('sheet-x').onclick = () => { sheet.style.display = 'none'; selectedId = null; };
function renderSheet() {
  const t = tracks.find(x => x.id === selectedId); if (!t) return;
  const last = t.points[t.points.length - 1];
  const name = t.profile === 'reactive' ? 'Реактивний БпЛА' : (t.weapon === 'shahed' ? 'Шахед' : 'БпЛА');
  const route = t.points.map(p => p.place).filter((v, i, a) => v && a.indexOf(v) === i).slice(-5).join(' → ');
  const fc = (t.forecast || []).map(f => `<span class="chip">${f.name} · ~${f.eta_min} хв</span>`).join('');
  sheetBody.innerHTML = `<h3>${name}${t.count > 1 ? ' ×' + t.count : ''}</h3><div class="kv">
    <span>Швидкість</span><span>${t.speed_kmh ? '~' + Math.round(t.speed_kmh) + ' км/год' : '—'} (${t.speed_source === 'measured' ? 'за зміщенням між зведеннями' : 'типова, ще немає двох точок'})</span>
    <span>Курс</span><span>${t.heading === null ? 'ще невідомий' : compass(t.heading) + ', ' + t.heading + '°'}</span>
    <span>Остання відмітка</span><span>${fmtTime(last.ts)} · ${last.place || '—'}</span>
    <span>Маршрут</span><span>${route || '—'}</span></div>
    ${fc ? `<div class="chips">${fc}</div>` : ''}
    <div class="note">Орієнтовно: позиція виводиться зі зведень моніторингових каналів, не з радара. Висота у джерелах не вказується.</div>`;
}

// ---------- HUD, стрічка, час ----------
function updateHud(stat) {
  const ts = curTs();
  document.getElementById('st-main').textContent = stat.active ? `Цілей на карті: ${stat.active}` : 'Активних цілей немає';
  document.getElementById('st-sub').textContent = stat.active
    ? `${stat.reactive ? 'реактивних: ' + stat.reactive + ' · ' : ''}дані на ${fmtClock(dataTs || serverNow)}`
    : `дані на ${fmtClock(dataTs || serverNow)}`;
  const c = document.getElementById('clock');
  c.textContent = viewTs === null ? 'LIVE ' + fmtClock(ts) : '⏪ ' + fmtClock(ts);
  c.className = viewTs === null ? 'live' : 'past';
  const all = [];
  for (const t of tracks) { const m = markers.get(t.id); if (m && m.pos && !m.pos.stale && viewTs === null) for (const f of t.forecast || []) all.push(f); }
  all.sort((a, b) => a.eta_min - b.eta_min);
  const seen = new Set(), top = [];
  for (const f of all) if (!seen.has(f.name)) { seen.add(f.name); top.push(f); if (top.length === 6) break; }
  document.getElementById('ticker').innerHTML = top.length
    ? '<b>Можливо до:</b> ' + top.map(f => `${f.name} ~${f.eta_min} хв`).join(' · ')
    : (viewTs === null ? 'Попереджень по напрямках немає.' : 'Режим перемотки: прогноз вимкнено.');
  const scrub = document.getElementById('scrub');
  const t0 = nowTs() - WINDOW_MIN * 60;
  if (document.activeElement !== scrub) scrub.value = Math.round(((ts - t0) / (nowTs() - t0)) * 1000);
  document.getElementById('t-from').textContent = fmtTime(t0);
}

// ---------- гео-сторож (риск считается на устройстве: координаты никуда не уходят) ----------
let me = null, meRadius = 10, watchId = null, lastRank = {};
const RANK = { watch: 1, imminent: 2, over: 3 };
function riskFor(point, ts) {
  const out = [];
  for (const t of tracks) {
    const m = markers.get(t.id); if (!m || !m.pos || m.pos.stale) continue;
    const here = m.pos.ll, d = dist(here, point);
    if (d > meRadius * 3) continue;
    let appr = false, cpa = d, eta = null;
    if (t.heading !== null && t.speed_kmh > 0) {
      const off = angDiff(t.heading, bearing(here, point));
      appr = off < 75; cpa = off < 90 ? Math.abs(d * Math.sin(rad(off))) : d;
      if (appr) eta = Math.max(0, Math.round(d * Math.cos(rad(off)) / t.speed_kmh * 60));
    }
    let level = null;
    if (d <= 3) level = 'over';
    else if (d <= meRadius && (appr || t.heading === null)) level = 'imminent';
    else if (d <= meRadius * 3 && appr && cpa <= meRadius) level = 'watch';
    if (level) out.push({ t, level, d, eta, side: compass(bearing(point, here)), cpa });
  }
  return out.sort((a, b) => a.d - b.d);
}
function riskLine(r) {
  const name = r.t.profile === 'reactive' ? 'Реактивний БпЛА' : 'Шахед';
  const v = `~${Math.round(r.t.speed_kmh)} км/год`;
  if (r.level === 'over') return `🔴 ${name} над вами або поруч (~${r.d.toFixed(1)} км). В укриття!`;
  if (r.level === 'imminent') return `🟠 ${name}: ${r.d.toFixed(1)} км, ${r.side}, ${r.t.heading !== null ? 'курс на вас' : 'курс невідомий'}${r.eta !== null ? ', орієнтовно ' + r.eta + ' хв' : ''} (${v})`;
  return `🟡 ${name}: ${r.d.toFixed(1)} км, ${r.side}, може пройти за ~${r.cpa.toFixed(0)} км від вас, ~${r.eta} хв (${v})`;
}
let audio = null, soundOn = localStorage.getItem('rd_snd') !== '0';
function alarm(level) {
  if (navigator.vibrate) try { navigator.vibrate(level === 'watch' ? [120] : [250, 120, 250, 120, 400]); } catch (e) {}
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const beeps = level === 'watch' ? 1 : 3, base = level === 'over' ? 980 : 760;
    for (let i = 0; i < beeps; i++) {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * 0.28;
      o.type = 'square'; o.frequency.value = i % 2 ? base * 0.8 : base;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + 0.24);
    }
  } catch (e) {}
}
function evalMe() {
  const banner = document.getElementById('banner');
  if (!me) { banner.style.display = 'none'; return; }
  const risks = riskFor(me, nowTs());
  if (!risks.length) { banner.style.display = 'none'; lastRank = {}; return; }
  banner.className = 'panel ' + risks[0].level;
  banner.innerHTML = risks.slice(0, 3).map(riskLine).join('<br>');
  banner.style.display = 'block';
  let escalate = null;
  for (const r of risks) { if ((RANK[r.level] || 0) > (lastRank[r.t.id] || 0)) { escalate = r.level; } lastRank[r.t.id] = RANK[r.level]; }
  if (escalate) {
    alarm(escalate);
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('AirRadar', { body: riskLine(risks[0]), tag: 'airradar-risk', renotify: true, requireInteraction: true }); } catch (e) {}
    }
  }
}
document.getElementById('btn-me').onclick = () => {
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; me = null; meLayer.clearLayers(); document.getElementById('btn-me').classList.remove('on'); evalMe(); return; }
  if (!navigator.geolocation) { alert('Геолокація недоступна в цьому браузері'); return; }
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  const r = prompt('Радіус попередження, км (5 / 10 / 15 / 25):', String(meRadius));
  if (r && [5, 10, 15, 25].includes(+r)) meRadius = +r;
  document.getElementById('btn-me').classList.add('on');
  watchId = navigator.geolocation.watchPosition(pos => {
    me = [pos.coords.latitude, pos.coords.longitude];
    meLayer.clearLayers();
    L.marker(me, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false }).addTo(meLayer);
    L.circle(me, { radius: meRadius * 1000, color: '#5ac8fa', weight: 1, fillOpacity: .05, dashArray: '4 6', interactive: false }).addTo(meLayer);
    if (!window._meCentered) { map.setView(me, 9); window._meCentered = true; }
    evalMe();
  }, () => { alert('Не вдалося отримати геопозицію'); }, { enableHighAccuracy: true, maximumAge: 5000 });
};
const sndBtn = document.getElementById('btn-snd');
sndBtn.textContent = soundOn ? '🔔' : '🔕';
sndBtn.onclick = () => { soundOn = !soundOn; localStorage.setItem('rd_snd', soundOn ? '1' : '0'); sndBtn.textContent = soundOn ? '🔔' : '🔕'; if (soundOn) alarm('watch'); };

// ---------- перемотка ----------
const scrub = document.getElementById('scrub'), speedSel = document.getElementById('speed');
scrub.oninput = () => { const t0 = nowTs() - WINDOW_MIN * 60; viewTs = t0 + (scrub.value / 1000) * (nowTs() - t0); if (+scrub.value >= 999) viewTs = null; };
document.getElementById('btn-live').onclick = () => { viewTs = null; playing = false; document.getElementById('btn-play').textContent = '▶'; };
document.getElementById('btn-back').onclick = () => { viewTs = Math.max(nowTs() - WINDOW_MIN * 60, curTs() - 15 * 60); };
document.getElementById('btn-play').onclick = () => {
  playing = !playing; document.getElementById('btn-play').textContent = playing ? '⏸' : '▶';
  if (playing && viewTs === null) viewTs = Math.max(nowTs() - WINDOW_MIN * 60, nowTs() - 60 * 60);
};

// ---------- данные ----------
function demoData() {
  const now = Math.floor(Date.now() / 1000), mk = (i, start, brg, v, profile, count) => {
    const pts = []; let p = start;
    for (let k = 0; k <= 9; k++) { pts.push({ ts: now - (9 - k) * 420, lat: p[0], lon: p[1], count, place: 'Точка ' + (k + 1), precision: 'place' }); p = dest(p, brg, v * 420 / 3600); }
    const last = pts[pts.length - 1], towns = [['Біла Церква', 49.80, 30.12], ['Фастів', 50.08, 29.92], ['Васильків', 50.18, 30.32], ['Київ', 50.45, 30.52], ['Обухів', 50.11, 30.62], ['Бровари', 50.51, 30.79]];
    const fc = towns.map(t => ({ name: t[0], lat: t[1], lon: t[2], d: dist([last.lat, last.lon], [t[1], t[2]]), off: angDiff(brg, bearing([last.lat, last.lon], [t[1], t[2]])) }))
      .filter(f => f.off < 50 && f.d < v).map(f => ({ name: f.name, lat: f.lat, lon: f.lon, eta_min: Math.max(1, Math.round(f.d / v * 60)), km: Math.round(f.d) })).sort((a, b) => a.eta_min - b.eta_min);
    return { id: 'demo' + i, weapon: 'shahed', profile, status: 'active', count, speed_kmh: v, speed_source: 'measured', heading: brg, points: pts, forecast: fc };
  };
  return { now, tracks: [mk(1, [48.9, 30.0], 20, 180, '', 3), mk(2, [50.9, 33.9], 255, 175, '', 1), mk(3, [49.3, 34.6], 300, 560, 'reactive', 2), mk(4, [47.6, 31.0], 5, 185, '', 4), { ...mk(5, [51.4, 31.0], 190, 0, '', 1), heading: null, speed_kmh: 180, speed_source: 'typical', points: [{ ts: now - 120, lat: 51.4, lon: 31.0, count: 1, place: 'Чернігів', precision: 'place' }], forecast: [] }] };
}
// Живой API (сервер бота) -> иначе статический tracks.json (GitHub Pages, обновляется сервером раз в ~2 мин).
let useStatic = /github\.io$/.test(location.hostname), dataTs = 0;
async function fetchTracks() {
  if (!useStatic) {
    try {
      const r = await fetch(`/api/tracks?minutes=${WINDOW_MIN}`, { cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch (e) { /* падаем на статику */ }
    useStatic = true;
  }
  const r = await fetch(new URL('tracks.json', document.baseURI).href + '?t=' + Math.floor(Date.now() / 30000), { cache: 'no-store' });
  if (!r.ok) throw new Error('tracks.json ' + r.status);
  return await r.json();
}
async function load() {
  try {
    const data = DEMO ? demoData() : await fetchTracks();
    tracks = (data.tracks || []).filter(t => t.points && t.points.length);
    dataTs = data.now || 0;
    // Статика старше реального времени: часы берём у клиента, экстраполяция добирает отставание.
    serverNow = (useStatic && !DEMO) ? Math.floor(Date.now() / 1000) : (data.now || Math.floor(Date.now() / 1000));
    fetchedAt = Date.now();
    if (selectedId) renderSheet();
  } catch (e) { document.getElementById('st-sub').textContent = 'немає зв’язку з сервером'; }
}

let last = performance.now(), lastSlow = 0;
function frame(nowMs) {
  const dt = (nowMs - last) / 1000; last = nowMs;
  if (playing && viewTs !== null) {
    viewTs += dt * +speedSel.value;
    if (viewTs >= nowTs()) { viewTs = null; playing = false; document.getElementById('btn-play').textContent = '▶'; }
  }
  const stat = renderTracks();
  // Маркеры двигаются каждый кадр; следы, прогноз и HUD — 4 раза в секунду (иначе мерцают подсказки).
  if (nowMs - lastSlow > 250) { lastSlow = nowMs; drawTrailsAndForecast(curTs()); updateHud(stat); }
  requestAnimationFrame(frame);
}
load().then(() => {
  const live = tracks.map(t => t.points[t.points.length - 1]);
  if (live.length) map.fitBounds(L.latLngBounds(live.map(p => [p.lat, p.lon])).pad(0.6), { maxZoom: 9, animate: false });
  requestAnimationFrame(frame);
});
setInterval(load, 10000);
setInterval(evalMe, 5000);
</script>
