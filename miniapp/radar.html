<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AirRadar — Радар загроз</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#0b0e14; --panel:rgba(16,20,30,.92); --line:rgba(255,255,255,.10); --txt:#eef1f6; --dim:#8b95a8;
          --red:#ff3b30; --orange:#ff9f0a; --yellow:#ffd60a; --cyan:#5ac8fa; --green:#30d158; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--txt); font:14px -apple-system,'Segoe UI',sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; background:var(--bg); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px); }

  #hud { position:absolute; top:10px; left:10px; right:10px; z-index:1000; display:flex; gap:8px; align-items:flex-start; pointer-events:none; }
  #hud > * { pointer-events:auto; }
  #status { padding:9px 12px; flex:1; min-width:0; }
  #status b { font-size:15px; }
  #status .sub { color:var(--dim); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn { padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); font:inherit; cursor:pointer; }
  .btn.on { border-color:var(--cyan); color:var(--cyan); }
  .btn:active { transform:scale(.97); }

  #banner { position:absolute; top:70px; left:10px; right:10px; z-index:1100; display:none; padding:12px 14px; border-radius:14px; font-weight:600; line-height:1.35; }
  #banner.imminent, #banner.over { background:rgba(255,59,48,.94); animation:pulse 1s infinite; }
  #banner.watch { background:rgba(255,159,10,.94); color:#1a1200; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px rgba(255,59,48,.35); } }

  #ticker { display:none; position:absolute; left:10px; right:10px; bottom:112px; z-index:1000; padding:7px 12px; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ticker b { color:var(--yellow); font-weight:600; }

  #timebar { position:absolute; left:10px; right:10px; bottom:10px; z-index:1000; padding:10px 12px; }
  #timebar .row { display:flex; gap:8px; align-items:center; }
  #timebar input[type=range] { flex:1; accent-color:var(--cyan); height:28px; }
  #clock { min-width:96px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  #clock.live { color:var(--green); } #clock.past { color:var(--orange); }
  select.btn { padding:8px 6px; }

  #sheet { position:absolute; left:10px; right:10px; bottom:170px; z-index:1200; padding:14px; display:none; max-height:45vh; overflow:auto; }
  #sheet h3 { font-size:16px; margin-bottom:6px; }
  #sheet .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; }
  #sheet .kv span:nth-child(odd) { color:var(--dim); }
  #sheet .close { position:absolute; top:8px; right:12px; font-size:20px; color:var(--dim); cursor:pointer; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { padding:3px 9px; border-radius:999px; background:rgba(255,214,10,.14); color:var(--yellow); font-size:12px; }
  .note { margin-top:8px; font-size:11px; color:var(--dim); }

  .sh { position:relative; width:46px; height:46px; }
  .sh svg { width:32px; height:32px; overflow:visible; filter:drop-shadow(0 0 6px var(--glow,#ff3b30)); transition:opacity .4s; }
  .sh.stale svg { opacity:.4; filter:grayscale(1); }
  .sh .cnt { position:absolute; right:-6px; top:-6px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:#fff; color:#111; font:700 11px/18px sans-serif; text-align:center; }
  .sh .unk { position:absolute; inset:0; display:grid; place-items:center; font:700 18px sans-serif; color:#fff; }
  .prop { transform-origin:32px 50px; animation:spin .12s linear infinite; }
  @keyframes spin { to { transform:rotate(180deg); } }
  .lbl { background:rgba(10,12,18,.85); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:2px 6px; font-size:11px; white-space:nowrap; }
  .leaflet-container { font:inherit; }
  #list { position:absolute; left:10px; right:10px; bottom:150px; z-index:1050; max-height:38vh; overflow:auto; display:block; padding:0; }
  @media (min-width:800px) { #list { right:auto; width:330px; top:70px; bottom:170px; max-height:none; } }
  #list.hidden { display:none; }
  #list-head { position:sticky; top:0; background:var(--panel); padding:10px 12px 8px; border-bottom:1px solid var(--line); z-index:2; }
  #list-head .total { font-size:13px; color:var(--dim); } #list-head .total b { font-size:20px; color:var(--txt); margin-left:6px; }
  .cats { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .cat { display:inline-flex; gap:5px; align-items:center; padding:4px 9px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.04); font-size:12px; cursor:pointer; user-select:none; }
  .cat i { font-style:normal; } .cat.off { opacity:.35; }
  .row-it { display:flex; gap:10px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row-it:active { background:rgba(255,255,255,.06); }
  .row-it .ic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-size:15px; flex:none; color:#fff; }
  .row-it .tx { flex:1; min-width:0; } .row-it .tt { font-weight:600; font-size:13px; } .row-it .st { color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-it .ag { color:var(--dim); font-size:11px; white-space:nowrap; }
  .row-it.fresh .ag { color:var(--red); font-weight:600; }
  .empty { padding:16px 12px; color:var(--dim); font-size:13px; }
  .ev { position:relative; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:17px; background:rgba(10,12,18,.88); border:2px solid var(--ec,#ffd60a); box-shadow:0 0 10px var(--ec,#ffd60a); }
  .ev.fresh::after { content:''; position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--ec,#ffd60a); animation:ring 1.6s ease-out infinite; }
  .ev.old { opacity:.5; box-shadow:none; }
  @keyframes ring { from { transform:scale(.7); opacity:.9; } to { transform:scale(1.5); opacity:0; } }
  .dst { background:rgba(10,12,18,.9); color:#fff; border:1px solid #5ac8fa; border-radius:8px; padding:2px 7px; font:600 11px sans-serif; white-space:nowrap; transform:translate(-50%,-135%); display:inline-block; }
  .dst::before { content:'🎯 '; }
  .me { width:18px; height:18px; border-radius:50%; background:var(--cyan); border:3px solid #fff; box-shadow:0 0 0 6px rgba(90,200,250,.3); }
  .leaflet-control-attribution { font-size:9px; opacity:.6; }

  /* ---- Neptun-стиль: ліва панель «Обстановка», праворуч колонка кнопок, білі стрілки ---- */
  #hud { left:auto; right:10px; top:10px; flex-direction:column; gap:6px; }
  #status { display:none; }
  #hud .btn { width:42px; height:42px; padding:0; display:grid; place-items:center; font-size:17px; border-radius:12px; }
  #timebar { display:none; } #timebar.show { display:block; }
  #list { background:rgba(205,207,212,.90); color:#16181d; border:none; border-radius:18px; }
  @media (min-width:800px) { #list { left:12px; top:12px; bottom:12px; width:340px; } }
  #list-head { background:rgba(205,207,212,.97); border-bottom:1px solid rgba(0,0,0,.08); }
  #list-head .total { color:#444; } #list-head .total b { color:#16181d; font-size:26px; }
  .cat { background:rgba(255,255,255,.7); border:1px solid rgba(0,0,0,.08); color:#16181d; font-weight:600; }
  .grp { display:flex; justify-content:space-between; align-items:center; margin:8px 8px 2px; padding:7px 10px; border-radius:10px; background:rgba(255,255,255,.85); font-weight:700; font-size:12.5px; }
  .grp span { background:rgba(0,0,0,.08); border-radius:8px; padding:1px 8px; font-size:12px; }
  .row-it { border-bottom:none; padding:8px 14px; }
  .row-it:active { background:rgba(0,0,0,.06); }
  .row-it .tt { color:#16181d; font-size:14px; } .row-it .st { color:#555; } .row-it .ag { color:#666; }
  .row-it .ic { border-radius:10px; width:34px; height:34px; }
  .empty { color:#444; }
  .ev svg { width:19px; height:19px; color:var(--ec); } .row-it .ic svg { width:20px; height:20px; } .cat i svg { width:14px; height:14px; vertical-align:-2px; }
  .sh { width:34px; height:34px; } .sh svg { width:32px; height:32px; filter:drop-shadow(0 0 2px rgba(0,0,0,.9)); }
  .sh .cnt { right:-8px; top:-8px; }

  /* ---- стиль «Мапи тривог»: плоска темна мапа, кольорові області, нижній лист області ---- */
  #map { background:#10131a; }
  #status { display:block; position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:1000; white-space:nowrap; padding:7px 14px; text-align:center; }
  @media (max-width:799px) { #status { left:10px; transform:none; right:62px; white-space:normal; } }
  .oblbl { background:none; border:none; box-shadow:none; color:var(--lbl,#9fb4ff); font:600 10px sans-serif; text-shadow:0 0 3px #000; padding:0; pointer-events:none; }
  .oblbl::before { display:none; }
  .leaflet-tooltip.oblbl { opacity:.95; }
  #rsheet { position:fixed; left:0; right:0; bottom:0; z-index:1300; max-height:58vh; overflow:auto; display:none; background:#1c1f26; color:#eef1f6; border-radius:16px 16px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.5); padding:14px 14px 20px; }
  @media (min-width:800px) { #rsheet { left:auto; right:12px; bottom:12px; width:380px; border-radius:16px; max-height:70vh; } }
  #rsheet .hd { display:flex; justify-content:space-between; align-items:flex-start; }
  #rsheet h3 { font-size:17px; } #rsheet .tm { color:#8b95a8; font-size:12px; margin-top:2px; }
  #rsheet .x { font-size:22px; color:#8b95a8; cursor:pointer; padding:0 4px; }
  #rsheet .chips2 { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px; }
  #rsheet .chips2 span { padding:5px 10px; border-radius:6px; background:#343842; font-size:13px; }
  #rsheet .chips2 span.red { background:#7a2230; }
  #rsheet h4 { margin:14px 0 6px; font-size:14px; color:#cfd4de; }
  .acard { display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; margin-bottom:8px; background:#6b2a2f; }
  .acard.y { background:#6b5522; } .acard.t { background:#2a2e38; }
  .acard .ai { width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.92); color:#222; display:grid; place-items:center; flex:none; }
  .acard .ai svg { width:19px; height:19px; }
  .acard .a1 { font-weight:700; font-size:14px; } .acard .a2 { font-size:12px; opacity:.85; margin-top:2px; }
  /* ---- нижнє меню і вкладки (як у «Мапи тривог») ---- */
  #mtools { position:fixed; right:62px; bottom:66px; z-index:1000; display:flex; gap:6px; } #mtools .btn { width:40px; height:40px; padding:0; display:grid; place-items:center; font-size:16px; } #mtools .btn.on { border-color:#ff6b6b; color:#ff6b6b; }
  @media (min-width:800px) { #mtools { bottom:78px; } }
  .gh { width:36px; height:36px; border-radius:50%; border:2px dashed rgba(255,255,255,.8); background:rgba(10,12,18,.6); display:grid; place-items:center; color:#fff; cursor:pointer; animation:ghp 2.4s ease-in-out infinite; }
  .gh svg { width:19px; height:19px; } .gh.y { border-color:#e8c860; color:#e8c860; } .gh.r { border-color:#ff8a80; color:#ff8a80; }
  .ghl { position:absolute; left:50%; top:40px; transform:translateX(-50%); white-space:nowrap; font:600 10px sans-serif; color:#fff; text-shadow:0 0 3px #000, 0 0 3px #000; pointer-events:none; }
  @keyframes ghp { 50% { opacity:.55; } }
  .bdg { display:inline-block; padding:1px 7px; border-radius:6px; font-size:11px; margin-top:3px; background:rgba(255,255,255,.1); } .bdg.ok { background:rgba(60,190,110,.25); color:#7ee0a0; } .bdg.warn { background:rgba(255,180,60,.2); color:#ffc061; }
  #nav { position:fixed; left:0; right:0; bottom:0; height:56px; z-index:1500; display:flex; background:#1c1f26; border-top:1px solid rgba(255,255,255,.08); padding-bottom:env(safe-area-inset-bottom); }
  #nav button { flex:1; background:none; border:none; color:#8b95a8; display:grid; place-items:center; cursor:pointer; position:relative; }
  #nav button.on { color:#ff6b6b; } #nav svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #nav .badge { position:absolute; top:6px; left:50%; margin-left:6px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:#c0392b; color:#fff; font:700 10px/17px sans-serif; text-align:center; }
  #timebar { bottom:66px !important; }
  #list { bottom:66px; } .nolbl .oblbl { display:none; } .leaflet-bottom { bottom:60px !important; } @media (min-width:800px) { .leaflet-bottom { bottom:68px !important; } } #sheet { bottom:70px !important; } #rsheet { bottom:56px !important; }
  @media (min-width:800px) { #rsheet { bottom:68px !important; } #list { bottom:68px !important; } }
  .view { position:fixed; left:0; right:0; top:0; bottom:56px; z-index:1400; overflow:auto; background:#15171d; color:#eef1f6; display:none; padding:14px 14px 24px; -webkit-overflow-scrolling:touch; }
  .view h2 { font-size:19px; margin-bottom:2px; } .view .sub { color:#8b95a8; font-size:12.5px; margin-bottom:10px; }
  .vw { max-width:760px; margin:0 auto; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .tabs button, .seg button { padding:6px 11px; border-radius:7px; border:none; background:#2a2d36; color:#cfd4de; font:inherit; font-size:13px; cursor:pointer; }
  .tabs button.on, .seg button.on { background:#7a2a33; color:#fff; }
  .seg { display:flex; gap:4px; background:#22252d; border-radius:10px; padding:4px; margin:8px 0; } .seg button { flex:1; background:none; }
  .view input[type=search], .view select { width:100%; padding:10px 12px; border-radius:10px; border:none; background:#2a2d36; color:#eef1f6; font:inherit; margin:6px 0; }
  .view .row2 { display:flex; gap:8px; } .view .row2 > * { flex:1; }
  .grph { margin:14px 0 6px; font-size:13px; color:#8b95a8; text-transform:uppercase; letter-spacing:.04em; }
  .acard .a3 { font-size:12px; opacity:.8; margin-top:2px; }
  .acard.o { background:#8a5420; }
  .vrow { display:flex; justify-content:space-between; align-items:center; padding:11px 12px; border-radius:10px; background:#23262f; margin-bottom:6px; }
  .vrow b { font-size:14px; } .vrow small { display:block; color:#8b95a8; font-size:12px; margin-top:2px; } .vrow .vv { font-size:17px; font-weight:700; }
  .vgrp { margin:16px 0 6px; font-weight:700; color:#cfd4de; display:flex; justify-content:space-between; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:130px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.1); }
  .bars i { flex:1; background:#d9685a; border-radius:3px 3px 0 0; position:relative; min-height:1px; } .bars i span { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); font:10px sans-serif; color:#aab; font-style:normal; }
  .bx { display:flex; gap:3px; font-size:10px; color:#8b95a8; } .bx span { flex:1; text-align:center; }
  .hbar { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:12.5px; } .hbar .n { width:130px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar .t { flex:1; background:#22252d; border-radius:4px; height:16px; } .hbar .t i { display:block; height:100%; background:#3aa6a0; border-radius:4px; } .hbar .v { width:46px; text-align:right; color:#aab; }
  .tl { position:relative; height:20px; margin:3px 0; background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4.1667%); border-radius:4px; }
  .tl i { position:absolute; top:2px; bottom:2px; border-radius:3px; min-width:3px; } .tl em { position:absolute; left:6px; top:2px; font:11px sans-serif; font-style:normal; color:#fff; text-shadow:0 0 3px #000; white-space:nowrap; pointer-events:none; }
  .th { display:flex; font-size:10px; color:#8b95a8; position:sticky; top:-14px; background:#15171d; padding:4px 0; z-index:2; } .th span { flex:1; text-align:center; }
  .fx { padding:12px; border-radius:12px; background:#23262f; margin-bottom:8px; } .fx .a1 { font-size:14px; line-height:1.4; } .fx .a2 { color:#8b95a8; font-size:12px; margin-top:6px; }
  .faq { background:#23262f; border-radius:12px; margin-bottom:8px; } .faq summary { padding:13px 14px; cursor:pointer; font-weight:600; } .faq div { padding:0 14px 14px; color:#cfd4de; font-size:13.5px; line-height:1.5; }
  .leg { display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13.5px; } .leg b { width:22px; height:22px; border-radius:6px; flex:none; } .leg svg { width:22px; height:22px; flex:none; color:#fff; }
  .opt { display:flex; justify-content:space-between; align-items:center; padding:13px 14px; border-radius:12px; background:#23262f; margin-bottom:8px; } .opt small { display:block; color:#8b95a8; font-size:12px; }
  .opt input[type=checkbox] { width:42px; height:24px; accent-color:#c0392b; }
  .chor { width:100%; height:auto; margin:6px 0; } .chor path { stroke:#0f1218; stroke-width:.6; }
</style>
<script src="native.js"></script>
</head>
<body>
<div id="map"></div>
<div id="hud">
  <div id="status" class="panel"><b id="st-main">Радар загроз</b><div class="sub" id="st-sub">завантаження…</div></div>
  <button class="btn on" id="btn-list" title="Обстановка">☰</button>
  <button class="btn" id="btn-share" title="Скопіювати посилання на цей вид карти">🔗</button>
  <button class="btn" id="btn-me" title="Стежити за моєю точкою">🛡</button>
  <button class="btn" id="btn-snd" title="Звук">🔔</button>
  <button class="btn" id="btn-time" title="Історія за часом">⏱</button>
  <button class="btn" id="btn-sat" title="Супутниковий знімок / схема" aria-label="Супутник">🛰</button>
  <button class="btn" id="btn-find" title="Пошук району / області" aria-label="Пошук">🔍</button>
  <input id="find-q" list="find-dl" placeholder="Район або область…" aria-label="Пошук району" style="display:none;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font:inherit;max-width:60vw"><datalist id="find-dl"></datalist>
</div>
<div id="banner" class="panel"></div>
<button id="ar-voice" onclick="speakStatus()" title="Голосова сводка" style="position:fixed;left:10px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:1300;border:0;border-radius:20px;padding:8px 12px;background:#222;color:#fff;font-size:14px">🔊 Озвучити статус</button>
<div id="list" class="panel"><div id="list-head"></div><div id="list-body"></div></div>
<div id="v-list" class="view"><div class="vw"></div></div>
<div id="v-dur" class="view"><div class="vw"></div></div>
<div id="v-stats" class="view"><div class="vw"></div></div>
<div id="v-hist" class="view"><div class="vw"></div></div>
<div id="v-help" class="view"><div class="vw"></div></div>
<div id="v-set" class="view"><div class="vw"></div></div>
<nav id="nav">
  <button data-v="map" class="on" title="Мапа"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span class="badge" id="nav-badge"></span></button>
  <button data-v="list" title="Список тривог"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></button>

  $v('d-body').innerHTML = Object.keys(by).sort((a, b) => tot[b] - tot[a]).map(s => `<div class="vgrp"><span>${esc(oblName(s))}</span><span>${by[s].length}</span></div>` +
    by[s].sort((a, b) => val(b) - val(a)).map(o => `<div class="vrow"><div><b>${esc(o.title)}</b><small>Тривалість: ${hm(o.dur)} · Середня тривалість: ${hm(o.dur / o.n)}</small></div><div class="vv">${f(o)}</div></div>`).join('')).join('')
    || '<div class="fx"><div class="a1">За цей період у журналі ще немає даних.</div><div class="a2">Журнал тривог накопичується з моменту підключення офіційного API, історія буде повнішою з кожним днем.</div></div>';
}
// ---------- Статистика ----------
let sPer = 'today', sSlug = '', sMet = 'n';
function renderStats() {
  const el = $v('v-stats').firstElementChild;
  if (!el.dataset.init) {
    el.dataset.init = 1;
    el.innerHTML = `<h2>Статистика</h2><div class="sub" id="s-sub"></div><select id="s-per">${PSEL}</select><select id="s-obl"><option value="">Усі області</option>${Object.entries(SLUG_NAME).sort((a, b) => a[1].localeCompare(b[1])).map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select>
      <div class="grph">Кількість оголошень тривог за годиною доби</div><div id="s-h"></div><div class="grph">Кількість тривог за областями</div><div class="seg" id="s-met"><button data-m="n">Кількість</button><button data-m="dur">Тривалість</button><button data-m="avg">Середня</button></div><div id="s-o"></div><div class="grph">За районами / містами</div><div id="s-r"></div><div class="grph">Точність наших прогнозів · 30 днів</div><div id="s-acc"></div>`;
    $v('s-per').onchange = e => { sPer = e.target.value; fillStats(); }; $v('s-obl').onchange = e => { sSlug = e.target.value; fillStats(); };
    $v('s-met').onclick = e => { const b = e.target.closest('button'); if (b) { sMet = b.dataset.m; fillStats(); } };
  }
  fillStats();
}
function fillStats() {
  const per = periodOf(sPer), all = aggregate(per, 'all', sSlug), val = o => sMet === 'n' ? o.n : (sMet === 'dur' ? o.dur : o.dur / Math.max(1, o.n)), fm = v => sMet === 'n' ? v : hm(v);
  [...$v('s-met').children].forEach(b => b.classList.toggle('on', b.dataset.m === sMet));
  $v('s-sub').textContent = new Date(per[0] * 1000).toLocaleDateString('uk-UA') + ' – ' + new Date(per[1] * 1000).toLocaleDateString('uk-UA');
  const hrs = new Array(24).fill(0);
  for (const r of hist.alerts || []) if (r[7] >= per[0] && r[7] <= per[1] && (!sSlug || r[1] === sSlug)) hrs[new Date(r[7] * 1000).getHours()]++;
  const mx = Math.max(1, ...hrs);
  $v('s-h').innerHTML = `<div class="bars">${hrs.map(v => `<i style="height:${Math.round(v / mx * 100)}%">${v ? `<span>${v}</span>` : ''}</i>`).join('')}</div><div class="bx">${hrs.map((_, i) => `<span>${String(i).padStart(2, '0')}</span>`).join('')}</div>`;
  const bar = (list, nameF) => { const m = Math.max(1e-9, ...list.map(x => x[1])); return list.map(([k, v]) => `<div class="hbar"><div class="n">${esc(nameF(k))}</div><div class="t"><i style="width:${Math.max(2, v / m * 100)}%"></i></div><div class="v">${fm(v)}</div></div>`).join('') || '<div class="fx"><div class="a1">Немає даних за період.</div></div>'; };
  const bo = {}; all.forEach(o => (bo[o.slug] = bo[o.slug] || []).push(o));
  $v('s-o').innerHTML = bar(Object.entries(bo).map(([s, a]) => [s, sMet === 'avg' ? a.reduce((x, o) => x + val(o), 0) / a.length : a.reduce((x, o) => x + val(o), 0)]).sort((a, b) => b[1] - a[1]), oblName);
  $v('s-r').innerHTML = bar(all.map(o => [o.title, val(o)]).sort((a, b) => b[1] - a[1]).slice(0, 25), x => x);
  const A = accData, ov = A && A.overall;
  $v('s-acc').innerHTML = !A ? '<div class="fx"><div class="a1">Дані про точність ще не зібрані.</div></div>' :
    `<div class="fx"><div class="a1"><b>${ov && ov.pct !== null ? ov.pct + '%' : 'замало даних'}</b> прогнозів «можливо до міста» збулися</div><div class="a2">Перевірено: ${ov ? ov.resolved : 0} (влучань ${ov ? ov.hits : 0}, промахів ${ov ? ov.misses : 0}). Прогноз збувся, якщо та сама ціль пройшла в межах 15 км від міста. Невідомий результат у точність не входить.</div></div>` +
    (A.regions || []).filter(r => r.slug).map(r => `<div class="hbar"><div class="n">${esc(oblName(r.slug))}</div><div class="t"><i style="width:${r.pct === null ? 4 : Math.max(3, r.pct)}%;background:${r.pct === null ? '#555' : (r.pct >= 70 ? '#3aa66a' : (r.pct >= 40 ? '#c9a23c' : '#c0504a'))}"></i></div><div class="v">${r.pct === null ? 'мало' : r.pct + '%'}</div></div>`).join('');
}
// ---------- Історія ----------
let hDay = dayStart(), hq = '';
function renderHist() {
  const el = $v('v-hist').firstElementChild;
  if (!el.dataset.init) {
    el.dataset.init = 1;
    el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><button class="btn" id="h-p">‹</button><h2 id="h-d" style="margin:0"></h2><button class="btn" id="h-n">›</button></div><input type="search" id="h-q" placeholder="Пошук області…"><div id="h-body"></div>`;
    $v('h-p').onclick = () => { hDay -= 86400; fillHist(); }; $v('h-n').onclick = () => { if (hDay < dayStart()) { hDay += 86400; fillHist(); } };
    $v('h-q').oninput = e => { hq = e.target.value.trim().toLowerCase(); fillHist(); };
  }
  fillHist();
}
function fillHist() {
  const d0 = hDay, d1 = hDay + 86400, nowS = Math.floor(Date.now() / 1000), d = new Date(d0 * 1000);
  $v('h-d').textContent = d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  const by = {};
  for (const r of hist.alerts || []) {
    const [, slug, , title, , lv, , s, e] = r, end = e || nowS;
    if (end < d0 || s > d1 || (hq && !(oblName(slug) + ' ' + title).toLowerCase().includes(hq))) continue;
    const o = by[slug] = by[slug] || {}; (o[title] = o[title] || []).push([Math.max(s, d0), Math.min(end, d1), lv]);
  }
  const pct = t => ((t - d0) / 864).toFixed(2);
  let h = `<div class="th">${Array.from({ length: 24 }, (_, i) => `<span>${String(i).padStart(2, '0')}</span>`).join('')}</div>`;
  for (const s of Object.keys(by).sort((a, b) => oblName(a).localeCompare(oblName(b)))) {
    h += `<div class="vgrp" style="margin:12px 0 2px">${esc(oblName(s))}</div>`;
    for (const t of Object.keys(by[s]).sort()) h += `<div class="tl">${by[s][t].map(([a, b, lv]) => `<i style="left:${pct(a)}%;width:${Math.max(.3, pct(b) - pct(a))}%;background:${lv === 'yellow' ? '#c9a23c' : '#8e2f38'}"></i>`).join('')}<em>${esc(t)}</em></div>`;
  }
  $v('h-body').innerHTML = h + (Object.keys(by).length ? '' : '<div class="fx" style="margin-top:12px"><div class="a1">За цю добу в журналі немає тривог.</div><div class="a2">Журнал накопичується з моменту підключення офіційного API.</div></div>');
}
// ---------- Довідка ----------
function renderHelp() {
  const el = $v('v-help').firstElementChild; if (el.dataset.init) return; el.dataset.init = 1;
  const sw = (c, t) => `<div class="leg"><b style="background:${c}"></b><span>${t}</span></div>`, ic = (g, t) => `<div class="leg">${g}<span>${t}</span></div>`;
  el.innerHTML = `<h2>Про AirRadar</h2><div class="fx"><div class="a1"><b>Мапа повітряних тривог і цілей</b><br>AirRadar показує офіційні тривоги (alerts.in.ua) та цілі за зведеннями моніторингових каналів: шахеди, ракети, КАБ, авіація.</div></div>
  <div class="fx" style="border-left:4px solid #c0392b"><div class="a1"><b>Важливо: це неофіційна мапа.</b> Не використовуйте її як основне джерело оповіщення. Орієнтуйтесь на офіційні сирени та Повітряні сили ЗСУ.</div></div>
  <div class="grph">Що означають кольори та іконки</div>
  <div class="fx">${sw('#6b2a2f', '<b>Червоний</b> — повітряна тривога, підвищена загроза (ракетна небезпека)')}${sw('#c9a23c', '<b>Жовтий</b> — знижена загроза, зокрема БпЛА (шахеди)')}${sw('#e8872a', 'Загроза артобстрілу')}${sw('#5a49b5', 'Загроза вуличних боїв')}${sw('linear-gradient(90deg,#9a2a32,#4b1e28)', 'Темніший колір — довше триває тривога')}${sw('#1b2338', 'Немає інформації про тривогу чи загрозу')}<div class="leg"><span class="gh" style="width:22px;height:22px;animation:none;flex:none"></span><span>Пунктирна мітка — офіційна тривога є, а позиції цілі за зведеннями ще немає</span></div>${sw('#4a2230', 'Тривога в частині району (громади)')}</div>
  <div class="fx">${ic(ICO.drone, 'Ударний БпЛА (шахед)')}${ic(ICO.drone.replace('<svg', '<svg style="color:#b57bff"'), 'Реактивний БпЛА')}${ic(ICO.fpv, 'FPV / Ланцет')}${ic(ICO.missile, 'Ракета / балістика')}${ic(ICO.cruise, 'Крилата ракета')}${ic(ICO.kab, 'Керована авіабомба (КАБ)')}${ic(ICO.air, 'Авіація')}${ic(ICO.arty, 'РСЗВ / артилерія / влучання')}</div>
  <div class="grph">Часті запитання</div>
  <details class="faq"><summary>Я побачив ракету чи безпілотник. Що робити?</summary><div>Не знімайте і не публікуйте, не підходьте до вікон. Негайно в укриття або в приміщення з двома стінами між вами й вулицею (коридор, ванна). Повідомте про побачене в «Повітряні сили ЗСУ» через чат-бот «Повітряна тривога» або за номером 102.</div></details>
  <details class="faq"><summary>Звідки дані?</summary><div>Офіційні тривоги — API alerts.in.ua. Цілі та їх рух — зведення моніторингових Telegram-каналів, які ми розбираємо і зводимо в треки. Прогноз підльоту — орієнтовний, швидкість беремо виміряну або типову для зброї.</div></details>
  <details class="faq"><summary>Чому в області тривога, а цілей на мапі нема?</summary><div>Офіційний сервіс дає лише район і тип загрози без координат. Канали публікують позицію пізніше, тому цілі з'являються з відставанням. Кольорова підсвітка з'являється одразу.</div></details>
  <details class="faq"><summary>Як працює «Мій район» і сповіщення?</summary><div>У боті @AirRadar_AI_bot увімкніть «Сторож»: бот пише про тривогу у вашому районі та про цілі, що летять до вашої точки, а у додатку лунає окремий тривожний звук.</div></details>
  <details class="faq"><summary>Тривога чи відбій не на мапі</summary><div>Оновіть сторінку та перевірте інтернет. Якщо розбіжність лишається — напишіть боту, ми перевіримо джерело.</div></details>`;
}
// ---------- Налаштування ----------
const SET = (() => { try { return JSON.parse(localStorage.getItem('rd_set') || '{}'); } catch (e) { return {}; } })();
const setSave = () => { try { localStorage.setItem('rd_set', JSON.stringify(SET)); } catch (e) {} };
function applySettings() {
  document.getElementById('map').classList.toggle('nolbl', SET.lbl === false);
  RA_OFF.opacity = SET.ra === false ? 0 : .5; restyleRaions();
  map.getPane('markerPane').style.display = SET.tg === false ? 'none' : '';
  map.getPane('tilePane').style.display = SET.osm ? '' : 'none';
  clearInterval(loadTimer); loadTimer = setInterval(load, (SET.ref || 10) * 1000);
}
let setTab = 'gen';
function renderSet() {
  const el = $v('v-set').firstElementChild, chk = (k, def = true) => (SET[k] === undefined ? def : SET[k]) ? 'checked' : '';

  const tabs = `<div class="tabs">${[['gen', 'Загальні'], ['thr', 'Загрози'], ['map', 'Мапа'], ['adv', 'Додатково']].map(([k, n]) => `<button data-t="${k}" class="${setTab === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  let body = '';
  if (setTab === 'gen') body = `<div class="opt"><span>Мова / Language<small>Поки доступна українська</small></span><b>Українська</b></div><div class="opt"><span>Оновлення даних<small>Як часто карта запитує нові дані</small></span><select id="o-ref" style="width:110px"><option value="10">10 с</option><option value="15">15 с</option><option value="30">30 с</option><option value="60">60 с</option></select></div><div class="opt"><span>Звук сповіщень<small>Тривожний сигнал у цій сторінці</small></span><button class="btn" id="o-snd">🔔</button></div>`;
  else if (setTab === 'thr') body = Object.entries(CATS).map(([k, c]) => `<label class="opt"><span style="display:flex;gap:10px;align-items:center"><span style="width:22px;color:${c.c}">${c.i}</span>${c.n}<small></small></span><input type="checkbox" data-c="${k}" ${hiddenCats.has(k) ? '' : 'checked'}></label>`).join('');
  else if (setTab === 'map') body = opt('lbl', 'Підписи областей', 'Назви областей на мапі') + opt('ra', 'Межі районів', 'Тонкі межі районів') + opt('tg', 'Цілі на мапі', 'Іконки шахедів, ракет, КАБ') + opt('osm', 'Підкладка OpenStreetMap', 'Вимкнено — плоска темна мапа', false);
  else body = `<div class="fx"><div class="a1"><b>AirRadar</b><br>Дані: alerts.in.ua (офіційне API) та зведення моніторингових каналів.</div><div class="a2">Журнал тривог: ${(hist.alerts || []).length} записів за 7 днів.</div></div><button class="btn" id="o-reset" style="width:100%;margin-top:6px">Скинути налаштування</button>`;
  el.innerHTML = `<h2>Налаштування</h2>${tabs}${body}`;
  el.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) { setTab = b.dataset.t; renderSet(); } };
  el.querySelectorAll('input[data-k]').forEach(i => i.onchange = () => { SET[i.dataset.k] = i.checked; setSave(); applySettings(); });
  el.querySelectorAll('input[data-c]').forEach(i => i.onchange = () => { i.checked ? hiddenCats.delete(i.dataset.c) : hiddenCats.add(i.dataset.c); try { localStorage.setItem('rd_hidden', JSON.stringify([...hiddenCats])); } catch (e) {} listSig = ''; });
  const r = $v('o-ref'); if (r) { r.value = String(SET.ref || 10); r.onchange = () => { SET.ref = +r.value; setSave(); applySettings(); }; }
  const sn = $v('o-snd'); if (sn) sn.onclick = () => sndBtn.click();
  const rs = $v('o-reset'); if (rs) rs.onclick = () => { for (const k in SET) delete SET[k]; setSave(); applySettings(); renderSet(); };
}
// ---------- навігація ----------
const VIEWR = { list: renderList, dur: renderDur, stats: renderStats, hist: renderHist, help: renderHelp, set: renderSet };
function showView(name) {
  curView = name;
  if (name !== 'map') document.getElementById('rsheet').style.display = 'none';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === name));

  if (name !== 'map') { VIEWR[name](); loadHist().then(() => { if (curView === name) VIEWR[name](); }); }
}
document.getElementById('nav').onclick = e => { const b = e.target.closest('button'); if (b) showView(b.dataset.v); };
setInterval(() => { if (curView === 'list') fillList(); }, 5000);

}
document.getElementById('mtools').onclick = e => {
